mvu:
  structure: |
    顶层结构：
    ├── 世界
    │   ├── 当前时间
    │   ├── 当前区域
    │   ├── 当前场景
    │   └── 近期事务
    ├── 主角
    │   ├── 姓名
    │   ├── 精神力（数值与等级：等级决定数值上限，脚本按等级硬压）
    │   ├── 饱食度
    │   ├── 军衔与军功（军功过门槛后可向军部申请升衔，批不批看军部）
    │   ├── 所属
    │   ├── 声望（0~1000）
    │   └── 尾勾
    ├── 论坛
    │   ├── 昵称
    │   ├── 声望（0~100，《触角》内部的地位）
    │   ├── 帖子（键为帖子ID，值含标题、作者、板块、正文、点赞、我的点赞、标记、发布时间、话题、评论数组）
    │   │   └── 评论是数组：每条含昵称、内容、点赞、我的点赞、时间，以及下挂的楼中楼回复
    │   │       楼层号由前端按下标算，不进变量
    │   ├── 热门话题（键为话题ID。全站正在聊的事，一条一句有情绪的话 + 热度数字 + 相关帖子ID。
    │   │       与帖子自己的「话题」字段是两个东西：那个是帖子的分类标签，这个是全网热议榜）
    │   ├── 公告（键为公告ID，置顶公告。理事会口径：匿名规则、板块新规、维护通知、全站活动）
    │   ├── 通知（点赞通知、评论回复、系统提示三类，由 AI 按剧情生成）
    │   ├── 私信
    │   └── $界面状态（隐藏。记录当前视图、板块、打开的帖子/公告/话题、发帖草稿、私信对象、设置。
    │       前缀带 $ 所以 AI 看不见也改不了，由前端自己读写。这是"放下终端再打开还是上次那一页"的解法）
    └── 关系
        ├── 蜜源名册
        └── 雄虫关系

ejs:
  entries: []

first_messages:
  - format: 叙事式
    word_count: 600~900
    output_path: 开场白/0.txt
    placeholder: <StatusPlaceHolderImpl/>
    scene: 前往星港的路上，主角与林昊初次相遇
    opening_situation: |
      主角是军校指挥官院的优秀毕业生，毕业后两年内在各个战场拿下数场大捷。
      与朋友的一次打赌，加上自己热衷挑战的好胜心，她决定前往洛希边境——
      那个因为翼族免疫精神攻击而成为雌虫禁地的地方。为了不引人注目，她特意身着便装。
      在出发前往星港的路上，她遇上了正要回去报到的军雄林昊，两人攀谈起来。
