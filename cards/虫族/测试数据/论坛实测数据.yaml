# 《触角》论坛实测数据
#
# 这不是卡的一部分，只是本地实测用的素材。两种用法：
#
# 用法一（全新建档）：把下面「论坛:」整段替换 cards/虫族/世界书/变量/initvar.yaml 里同名的段。
# 用法二（存档补数据，推荐）：按 论坛实测数据.patch.json 里的 JSON Patch 打到酒馆变量上。
#
# 数据是照着「洛希防线刚打完一场、主角上尉」这个时点编的，
# 板块、话题、评论深浅、通知类型都覆盖到了，用来验证前端的每一条路径。
#
# 时间一律写相对说法（「3小时前」「昨天」），不写绝对时刻——
# 这是虚构星历，没有真实时间基准可换算，AI 写剧情时反倒知道「这是几轮前的事」。

论坛:
  昵称: 落雨天
  # 论坛声望 41 = 「常驻网友」档（20~49）。剧情声望 260 是现实里的名气，两者独立。
  声望: 41

  # ── 热门话题：全站此刻在聊什么。一条一句有情绪的话 + 讨论量 ──
  # 注意跟帖子上的「话题」字段不是一回事：那边是分类标签，这里是全网热度。
  热门话题:
    '1':
      标题: 军雄临产期实战是否违规
      热度: 1200
      相关帖子:
        - '6'
        - '1'
    '2':
      标题: 亚雄科研员的手工蜜饼秘方
      热度: 952
      相关帖子: []
    '3':
      标题: 震惊！某议员雄侍被拍到在公共哺蜜亭喂陌生雌虫
      热度: 2600
      相关帖子: []
    '4':
      标题: 洛希前线的补给专列到底跑了几趟
      热度: 780
      相关帖子:
        - '1'
    '5':
      标题: 尾勾打结是不是本版最会说的人
      热度: 340
      相关帖子: []

  帖子:
    # ── 1. 热门板块会顶到最上面的那种：热度高、评论多、有楼中楼 ──
    '1':
      标题: 洛希那边到底打成什么样了，有没有人给个准话
      作者: 战场玫瑰
      板块: 热门
      正文: |-
        我姐在第三机动队，上个月调去洛希，到现在只发回来一条六个字的消息。
        新闻里天天说「局势可控」，可控是个什么概念？可控到人回不来吗。
        有没有在洛希服役的姐妹能说两句，不用说什么机密，就说个大概。
      点赞: 2483
      我的点赞: false
      标记: 爆
      发布时间: 3小时前
      话题:
        - '#洛希前线#'
        - '#军雌家属#'
      评论:
        - 昵称: 等归期
          内容: 三年了。别问了。
          点赞: 31
          我的点赞: false
          时间: 2小时前
          回复:
            - 昵称: 战场玫瑰
              内容: 对不起，我不该问的。
              点赞: 4
              我的点赞: false
              时间: 2小时前
            - 昵称: 尾勾打结
              内容: 她不是怪你。她是羡慕你还有得等。
              点赞: 22
              我的点赞: false
              时间: 1小时前
        - 昵称: 蜜源猎人
          内容: |-
            路过说一句，前线补给线是通的，蜜源专列这个月跑了四趟，我都见着车厢了。
            真打崩了不会有这个运力。
          点赞: 18
          我的点赞: true
          时间: 2小时前
          回复:
            - 昵称: 战场玫瑰
              内容: 这话比新闻管用。谢了。
              点赞: 6
              我的点赞: false
              时间: 1小时前
        - 昵称: 精神力B
          内容: 楼上说得对。我在后勤待过，运力骗不了人。
          点赞: 9
          我的点赞: false
          时间: 1小时前
          回复: []
        - 昵称: 匿名研究员
          内容: |-
            第三机动队上个月确实吃了硬仗，具体我不能说。
            能说的是：她们回来的时候是整建制回来的。
          点赞: 63
          我的点赞: true
          时间: 46分钟前
          回复:
            - 昵称: 等归期
              内容: 「整建制」。我把这三个字看了十遍。
              点赞: 41
              我的点赞: false
              时间: 31分钟前
            - 昵称: 战场玫瑰
              内容: 谢谢。真的谢谢。
              点赞: 12
              我的点赞: false
              时间: 12分钟前

    # ── 2. 求助专区：带楼主回复、有实际问答 ──
    '2':
      标题: 第一次吸蜜把人吸哭了，是我太用力还是他太脆
      作者: 蜜瘾重症
      板块: 求助专区
      正文: |-
        昨晚第一次，对方是刚入伍的军雄，看着挺结实的。
        我按教程来的，结果中途他开始抖，结束之后眼眶红了，一直没说话。
        我是不是做错了什么？还是说他就是体质差？下次还敢不敢找他。
      点赞: 22
      我的点赞: false
      标记: ''
      发布时间: 昨天
      话题:
        - '#取蜜经验#'
      评论:
        - 昵称: 蜜罐猛雌
          内容: |-
            妹妹，不是他脆，是你没给缓冲。
            军雄第一次被吸，最怕的不是被吸空，是完事之后没人搭理他。
            你抱一下、说句话，比什么都强。
          点赞: 38
          我的点赞: false
          时间: 昨天
          回复:
            - 昵称: 蜜瘾重症
              内容: ……我完事就去洗澡了。
              点赞: 5
              我的点赞: false
              时间: 昨天
            - 昵称: 蜜罐猛雌
              内容: 那就是你的问题了。下次记得。
              点赞: 26
              我的点赞: false
              时间: 昨天
        - 昵称: 蜜语者
          内容: 教程只教怎么吸，不教怎么处。这两件事差得远。
          点赞: 24
          我的点赞: true
          时间: 昨天
          回复: []
        - 昵称: 风流尾勾
          内容: 也有可能是他本来就紧张。军雄新兵普遍怕被吸完就调走。
          点赞: 15
          我的点赞: false
          时间: 21小时前
          回复: []

    # ── 3. 蜜事交流：测评向，主角点过赞 ──
    '3':
      标题: 星港区三家蜜源会所横向测评（含取蜜间条件）
      作者: 蜜源猎人
      板块: 蜜事交流
      正文: |-
        连去了三家，说点实在的。
        甲家：环境最好，蜜质中上，但雄侍轮换太勤，上次认的人这次就没了。
        乙家：条件一般，蜜质最好，有个编号 7 的雄侍值得回头。
        丙家：便宜，胜在不限时，适合状态不好只想躺着的时候去。
        不打分了，各位按自己需求挑。
      点赞: 71
      我的点赞: true
      标记: 热
      发布时间: 前天
      话题:
        - '#蜜源测评#'
      评论:
        - 昵称: 蜜罐猛雌
          内容: 乙家那位的编号我记下了，谢姐指路～
          点赞: 29
          我的点赞: false
          时间: 前天
          回复: []
        - 昵称: 匿名研究员
          内容: 从数据上说，蜜质跟雄虫的营养摄入直接相关，跟环境关系不大。乙家大概是把钱花在饲料上了。
          点赞: 44
          我的点赞: false
          时间: 前天
          回复:
            - 昵称: 蜜源猎人
              内容: 这个角度有意思，我一直以为是水质。
              点赞: 8
              我的点赞: false
              时间: 2天前
        - 昵称: 蜜瘾重症
          内容: 丙家不限时是真的吗，那我周末就去躺着
          点赞: 11
          我的点赞: false
          时间: 前天
          回复: []

    # ── 4. 匿名树洞：情绪向，评论画风明显不同。置顶样板 ──
    '4':
      标题: 升了衔，却不敢跟家里说
      作者: 落雨天
      板块: 匿名树洞
      正文: |-
        上尉的任命下来了。
        我第一个念头不是高兴，是想我妈会说「那你不是更危险了」。
        她到现在还以为我在后方做文书。
        每次视频我都把制服挂在门外。
      点赞: 88
      我的点赞: false
      标记: 置顶
      发布时间: 5小时前
      话题:
        - '#匿名树洞#'
      评论:
        - 昵称: 等归期
          内容: |-
            别说了。我姐也这样。
            她牺牲以后我们收拾遗物，柜子里三套便服，一套没穿过。
          点赞: 96
          我的点赞: false
          时间: 4小时前
          回复:
            - 昵称: 落雨天
              内容: 对不起。
              点赞: 3
              我的点赞: false
              时间: 4小时前
            - 昵称: 等归期
              内容: 不用对不起，说出来舒服点。
              点赞: 34
              我的点赞: false
              时间: 3小时前
        - 昵称: 战场玫瑰
          内容: 我懂。我妈到现在还觉得我在星港上班。
          点赞: 51
          我的点赞: true
          时间: 3小时前
          回复: []
        - 昵称: 尾勾打结
          内容: |-
            楼上两位，你们的妈可能早就知道了。
            母亲什么都看得出来，她只是配合你们演。
          点赞: 77
          我的点赞: false
          时间: 2小时前
          回复:
            - 昵称: 战场玫瑰
              内容: ……你别说了。
              点赞: 40
              我的点赞: false
              时间: 2小时前

    # ── 5. 冷帖：没人赞没人评、没标记没时间，用来验证空状态与排序 ──
    '5':
      标题: 问一下，尾勾长出来那几天会不会特别痒
      作者: 匿名用户
      板块: 匿名树洞
      正文: 我这几天痒得睡不着，不知道是不是正常的。有没有过来人。
      点赞: 2
      我的点赞: false
      标记: ''
      发布时间: ''
      话题: []
      评论: []

    # ── 6. 严肃向的社会热点，话题与 1 号帖呼应 ──
    '6':
      标题: 军雄征召年龄该不该再往下调，说说看法
      作者: 匿名研究员
      板块: 热门
      正文: |-
        议会那边在讨论把征召年龄下限从二十岁改到十八岁。
        理由是前线缺口。反对的理由是，十八岁的雄虫身体还没长足，产蜜量低、恢复慢，
        提前消耗等于把长期产能换成短期。
        不站队，只想听听不同意见。
      点赞: 34
      我的点赞: false
      标记: 新
      发布时间: 27分钟前
      话题:
        - '#洛希前线#'
        - '#军雄权益#'
      评论:
        - 昵称: 精神力B
          内容: 数字上你说得对。但前线缺口也是真的，站着说话不腰疼。
          点赞: 27
          我的点赞: false
          时间: 19分钟前
          回复: []
        - 昵称: 蜜罐猛雌
          内容: 我不懂政治，我只知道我家那位要是早两年被征走，我们到现在都攒不下钱。
          点赞: 19
          我的点赞: false
          时间: 14分钟前
          回复: []
        - 昵称: 尾勾打结
          内容: 楼上这才是真话。议会算的是总账，落到每家就是另一回事了。
          点赞: 42
          我的点赞: false
          时间: 6分钟前
          回复: []

  公告:
    '1':
      标题: 关于近期冒充军属发帖的处理说明
      正文: |-
        近期接到多起举报，有账号虚构前线亲属身份发布不实内容，借机煽动情绪。
        此类账号一经核实，永久封禁，不作申诉受理。
        请各位注意：真正的军属不需要靠细节取信于人。
      发布者: 《触角》理事会
      置顶: true
    '2':
      标题: 蜜事交流版测评规范（第三次修订）
      正文: |-
        即日起，本版测评帖须写明考察项，不得只写「好」「不好」。
        涉及会所与雄侍的内容，禁止出现可定位到具体个体的描述。
        违规帖折叠处理，三次以上禁言七日。
      发布者: 《触角》理事会
      置顶: true
    '3':
      标题: 星历 4412 年全站活动：写给前线的信
      正文: |-
        本周开放匿名投稿，内容将整理后随补给专列送往洛希。
        不收赞美，只收你想说的话。
      发布者: 《触角》理事会
      置顶: false

  通知:
    点赞:
      - 来源: 匿名研究员
        摘要: 赞了你的帖子《升了衔，却不敢跟家里说》
        已读: false
      - 来源: 战场玫瑰
        摘要: 赞了你的评论「对不起。」
        已读: false
      - 来源: 蜜源猎人
        摘要: 赞了你的帖子《升了衔，却不敢跟家里说》
        已读: true
    回复:
      - 来源: 等归期
        摘要: 回复了你的帖子《升了衔，却不敢跟家里说》
        已读: false
      - 来源: 尾勾打结
        摘要: 回复了你的评论「对不起。」
        已读: true
    系统:
      - 标题: 《触角》理事会
        内容: 你的帖子《升了衔，却不敢跟家里说》被加入本日树洞精选。
        已读: false
      - 标题: 系统
        内容: 论坛声望 +3。当前 41，常驻网友。
        已读: true

  私信:
    等归期: |-
      在树洞看见你那条了。
      我说话不好听，你别往心里去。
      你要是哪天想找人说话，可以私我。我一般都在。
    蜜罐猛雌: 妹妹！你上尉了？！请客请客～乙家我熟，姐带你去～

