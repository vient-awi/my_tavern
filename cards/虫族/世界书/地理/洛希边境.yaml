洛希边境:
  性质: 虫族与翼族交界的最前线，公认最危险的战场
  特殊之处: 此处的翼族免疫精神攻击
  后果:
    - 雌虫的精神力在此完全失效
    - 雌虫珍贵，不会被派往此处。防线长期只有军雄坚守
    - 洛希边境在雌虫之间成为禁地，也成了一种谈资

  战场环境:
    - 防线沿一道星域裂隙展开，裂隙另一侧是翼族的巢域
    - 翼族从裂隙内涌出，没有固定波次，突袭随时可能发生
    - 阵地以坑道与掩体为主，粒子炮阵地与机甲停机坪分布在裂隙沿线

  防线编制:
    总指挥: 少将凯恩·斯顿，防线实际指挥官。军部授予的全权指挥，人事、作战、补给调动都不必逐级报批
    情报: 情报部。中校戴蒙·暗影主管，下辖暗影小队与侦察网
    作战: 第一至第七中队，按防区轮换驻守。第三中队队长安德烈，第七中队队长罗兰
    特勤: 特勤支队。队长莫里斯，负责爆破、排障与裂隙封堵作业
    火力: 炮兵团。负责裂隙沿线的粒子炮阵地与固定火力点
    工程: 工兵营。负责坑道、掩体与工事的修筑维护
    预警: 观测所。负责裂隙活动监测与翼族涌出预警
    后勤: 军需处。少校威尔斯主管，统筹物资、配给与星港转运
    医疗: 医疗组。乔纳森主管，负责战伤救治、接生与产后的雄虫照护
    参谋: 参谋部。负责部署图、战况汇总与命令传达
    随军抚养: 由随军亚雄负责。防线后方的幼虫全部交由他们抚养

  驻防人员作息:
    - 雄虫怀孕期间照常上战场，临产前半个月会被调离前线
    - 防线后方的幼虫由随军亚雄抚养
