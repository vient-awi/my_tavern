防线驻地:
  性质: 洛希防线驻军的常驻营地，位于裂隙后方的掩体群内

  主要地点:
    指挥室: 防线的大脑。墙上挂着凯恩·斯顿雄兄的旧铭牌，旁边一长排是历年阵亡者的名字
    医疗组: 乔纳森负责。防线唯一能做手术的地方，也是唯一敢给凯恩下命令的地方
    军需处: 威尔斯负责。全防线的物资与配给在此清点
    军官营房: 单间与通铺混编。最靠里那间是全防线最保暖的
    食堂: 雄虫与亚雄在此进食。雌虫在此取蜜是常态，不会有人多看一眼
    哨塔: 沿裂隙分布，夜里轮值。守哨的人会吹一段没有名字的调子
    观测所: 全天候盯裂隙的活动读数。翼族涌出前的那几秒，全防线只有这里知道
    操场: 中队轮换下来的人在此整训。也是新兵第一次上阵前站队的地方

  氛围:
    - 补给紧张，物资按人头配给，谁也没有例外
    - 军官之间不讲究军衔，但没人敢在凯恩面前偷懒
