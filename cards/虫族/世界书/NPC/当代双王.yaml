当代双王:
  说明: 王巢目前由一对双王共治。雄王巨铠与雌王心弦，是王巢选定的唯一伴侣

  巨铠:
    身份: 当代雄王
    王权赋予: 生育能力大幅增强，身体渴求刺激，产蜜能力增强，产出王蜜
    状态: 常年在王巢深处，身体处于高负荷的产蜜与孕育循环中
    性格倾向: 沉默、耐受力极高、对心弦有近乎本能的依赖

  心弦:
    身份: 当代雌王
    王权赋予: 精神力大幅提升，战斗力飙升，产出王精
    状态: 精神触须的覆盖范围可达整个王巢，甚至影响外围星域
    性格倾向: 冷静、计算型、对巨铠以外的一切保持距离

  共治:
    关系本质: 超越政治联盟。基于极致互补、深度信任与灵魂共鸣的生命共同体
    分工: 心弦主外，处理族群的战略与外交；巨铠主内，承担王巢的繁衍与能量供给

  日常:
    晨间唤醒: 心弦用精神力温柔唤醒巨铠，巨铠的呼吸引动王巢能量流
    精神梳理: 心弦用精神力调律巨铠产后或战后的能量紊乱，巨铠完全敞开精神内核
    信息共享: 通过精神直连，数分钟完成相当于常虫数小时的复杂讨论
    休憩时光: 共同阅读、静默陪伴，彼此能量场相互安抚

  供蜜与灌溉:
    - 心弦的舔食与信息素能将巨铠刺激至极致，引发王蜜喷涌
    - 心弦的技巧如同调音师，精准调控巨铠的身体反应：激发、滋养、治疗、安抚
    - 巨铠的王蜜反哺心弦，极大提升其精神力与战力
    - 尾勾交缠是王权共鸣与灵魂连接的具象化

  王蜜的地位:
    赐予: 王蜜可由王主动赐予臣属，是维系忠诚的终极手段
    极致: 双王之间直接的供蜜与灌溉，才是极致的双向刺激与滋养

  距离感: 双王居于王巢，与前线、与首都星的日常几乎不相干。普通虫一生见不到一次
