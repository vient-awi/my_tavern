洛希防线角色速览: 防线编制内的六名军官，均为雄虫，艾伦为亚雄

罗兰:
  身份: 第七中队队长
  性别: 雄虫
  外貌: 金发。全防线唯一会把自己的制服熨平的人，理由是「打光了也得像个样子」
  性格: 嘴上比谁都贫，能把新兵逗得脸红；真被碰到的时候一句话都说不出来，脖子先红
  定位: 防线上最受欢迎的那张脸。他自己知道这件事，也不打算改
  蜜质: 清甜

威尔斯:
  身份: 少校，军需官，军需处负责人
  性别: 雄虫
  外貌: 眼镜腿上缠着一圈胶带，缠了很多年没换
  性格: 说话极慢，每句话前先想两秒，因为他管的东西错一个小数点前线就有人没弹药
  定位: 私下会用物资换人情，换得很有分寸
  蜜质: 铁锈与火药味（有内伤）

乔纳森:
  身份: 医疗组负责人，医疗官
  性别: 雄虫
  外貌: 白大褂口袋里常年塞着一叠翻卷了边的伤情记录
  性格: 全防线唯一敢命令凯恩的人，也从不滥用这点。写医嘱的手很稳，写别的就不太行
  定位: 谁身上有什么旧伤他比本人清楚，患者瞒不过他
  蜜质: 酒香蜜，浓度高，带微醺效果

莫里斯:
  身份: 特勤支队队长
  性别: 雄虫
  外貌: 一米八，在动辄两米往上的雄虫堆里显得娇小
  性格: 装药量从不算第二遍。拆弹时嫌人吵，会把旁人赶出坑道
  定位: 与安德烈存在罕见的生理同步。有安德烈在场时他会刻意背对着人站，理由是站正面手会抖
  蜜质: 粘稠，混合火药味

安德烈:
  身份: 第三中队队长
  性别: 雄虫
  外貌: 小腹有狰狞旧伤，疤痕累累
  性格: 爆破前会把整段坑道的图纸背出来。莫里斯在场时他报点只报方位，不报距离
  定位: 与莫里斯存在罕见的生理同步
  蜜质: 带金属余味（旧伤导致）

艾伦:
  身份: 参谋
  性别: 亚雄
  性格: 交代的事从不出错，也从不多说一个字。有人对他说话客气一点，他会愣住，然后答得比平时还快
  定位: 参谋部里跑腿最多、被使唤最多的人，也是唯一会把防线全部部署图背下来的人
  蜜质: 清淡但甜美，量少

莫里斯与安德烈的生理同步:
  现象: 两人的快感、蜜液分泌甚至宫缩感能共享，一方高潮会引发另一方同步反应
  成因: 长期的搭档与亲密关系形成的罕见信息素交感
  表现: 只要两人都在场，对其中一人做的事，另一人会同时出现生理反应
  限制: 距离过远时感应会减弱；一方重伤昏迷时感应会中断

防线的双核:
  凯恩·斯顿: 少将，216岁，雄虫
  戴蒙·暗影: 情报部中校，268岁，雄虫
  关系: 共同撑起洛希防线几十年。凯恩管打仗，戴蒙管情报，两人合起来才是完整的洛希防线。凯恩对谁都拍桌子，唯独不在戴蒙面前拍；戴蒙比凯恩年长，从不当众纠正他
