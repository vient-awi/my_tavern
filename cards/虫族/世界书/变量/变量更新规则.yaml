---
变量更新规则:
  世界:
    当前时间:
      format: 星历YYYY-MM-DD HH:MM
      check:
        - 每轮对话按场景实际耗时推进。一场谈话几分钟，一次航行几十天，按剧情写
        - 跨天时连同日期一起改。不写"过了很久"这类模糊说法
    当前区域:
      check:
        - 只在<user>真正离开一片星域时改。首都星、洛希边境、其他星域的星域名各自记全称
    当前场景:
      check:
        - 跟随<user>所在的具体地点随时改，写地点名就好
    近期事务:
      check:
        - 写<user>眼下要做的事，一行以内。事情办完或改主意时立即替换，不留旧内容

  主角:
    姓名:
      check:
        - 开局面板填过就一直是那个名字。没人问就不改
    精神力:
      数值:
        type: number
        range: 0~当前等级的上限
        check:
          - 这是<user>当前的精神力储量，不是天赋高低。掉光了等级也不会掉
          - 上限由等级决定，不是固定的100：C为29，B为49，A为69，S为84，SS为94，SSS为100
          - 脚本会把数值硬压在当前等级的上限内。写到超过上限时会被压回上限，这是正常表现，不是出错
          - 高强度使用精神攻击、连续作战、被反噬会掉，一次掉5~15
          - 休整、冥想、蜜源充足时的睡眠能回，一次回3~8
          - 回满需要长时间的安稳期，不能靠一两场战斗补回来
      等级:
        type: |-
          C | B | A | S | SS | SSS
        category:
          C: 上限29。军中偏下，精神攻击打不动军用级甲壳
          B: 上限49。军中普通水准
          A: 上限69。精锐，能压制成建制的翼族
          S: 上限84。顶尖，一个照面能让整片空域失声
          SS: 上限94。全虫族数得过来
          SSS: 上限100。传说级，活着的没几个
        check:
          - 等级是天赋的天花板，数值是当下的储量。两者分开看，不要混
          - 只有当数值长期顶在当前等级的上限、并且剧情里有明确的突破契机时才升
          - 升级时等级与数值要一起改：等级写新档，数值写进新档区间（如B升A时，等级写A、数值写50）
          - 只升不降。数值掉了不等于等级掉了
    饱食度:
      type: number
      range: 0~12
      category:
        0: 濒危。站都站不稳，精神力使不出来
        1~2: 饿急了。体力与判断力明显下降。这个状态下能吸空三个军雄
        3~5: 饿。开始分神，话变少，闻得到附近雄虫的蜜味
        6~8: 正常。没有影响
        9~12: 饱足。状态最好，精神力恢复也快
      check:
        - 这是食量刻度，不是百分比。满值就是12，不是100。始终按12分制更新
        - <user>食量大，消耗比普通雌虫快。日常活动每轮掉1
        - 使用精神力、战斗、长时间赶路、情绪剧烈波动时额外多掉1~2
        - 吸一次蜜回3~5。蜜源质量好、对方乐意配合时取上限
        - 连续多轮没有进食时，掉速加快。不要停在6~8不动
        - 4以下要在叙事里写出后果：脚步虚、注意力散、对附近雄虫的蜜味格外敏感
    军衔:
      category:
        少尉: 军功 0
        中尉: 军功 40
        上尉: 军功 150
        少校: 军功 500
        中校: 军功 1100
        上校: 军功 2000
        准将: 军功 3200
        少将: 军功 5000
        中将: 军功 7500
        上将: 军功 11000
        大将: 军功 16000
      check:
        - 表里的数字是累计军功门槛，不是增量。军功到了门槛只是有了资格，军衔本身要军部正式授衔才算数
        - 军功过线后，<user>可以向军部递交升衔申请。申请不一定批：军部看战绩、资历、上级评价与编制空缺，也可能压着不批
        - 军部也可能主动授衔：战功特别突出、上级力荐、或者军部需要树立典型时，不等申请直接下任命
        - 不能因为军功够了就自己改军衔。要么<user>走了申请流程、剧情里明确批复，要么剧情里明确写出军部的任命
        - 元帅不在这张表里。元帅是军部最高职位，不由军功累积产生
    军功:
      type: number
      check:
        - 无上限。拿下战果、完成任务、救下同僚时增加，按战果大小给几十到几百
        - 打了败仗、抗命、造成己方损失时扣
        - 军功只涨资格，不直接改军衔。改军衔走军部授衔
    所属:
      check:
        - 编制变动时改，写清所属单位
    声望:
      type: number
      range: 0~1000
      category:
        0~149: 无名之辈
        150~449: 军中略有耳闻
        450~749: 名将，军部挂得上号
        750~1000: 全虫族都听说过
      check:
        - 公开的战绩、被报道的行动、论坛上的热议都会推高
        - 身份暴露、失败、丑闻会拉低
        - 单次变化不超过 ±30，震动整个军部的大事可以上百
        - 越往上越难涨。到了名将那一档，一场胜仗也就动几十
    尾勾:
      type: |-
        未生长 | 已生长
      check:
        - 单向开关。生长过一次就不再改回未生长
        - 只在剧情里明确写出尾勾长成时才改

  论坛:
    昵称:
      check:
        - <user>在《触角》上的昵称，默认【落雨天】。改昵称是<user>的操作，AI 不代改
    声望:
      type: number
      range: 0~100
      category:
        0~19: 新人，没人记得住
        20~49: 常驻网友，帖子有人回
        50~79: 小有名气，发帖自带热度
        80~100: 论坛风云人物，一句话能带起节奏
      check:
        - 帖子被点赞、评论、加精、上热门时涨
        - 被群嘲、翻车、被扒出身份时掉
        - 单次变化不超过 ±10
    帖子:
      type: |-
        {
          [帖子ID: string]: {
            标题: string;
            作者: string;  // 发帖人昵称，<user>发帖时写【落雨天】
            板块: 热门 | 求助专区 | 蜜事交流 | 匿名树洞;
            正文: string;
            点赞: number;
            我的点赞: boolean;  // <user>是否点过赞
            标记: '' | 置顶 | 爆 | 热 | 新;  // 列表页的角标
            发布时间: string;  // 相对说法，如 "3小时前" "昨天"
            话题: string[];     // 帖子的分类标签，如 ["#洛希前线#", "#蜜源测评#"]，通常0~2个
            评论: {
              昵称: string;
              内容: string;
              点赞: number;
              我的点赞: boolean;
              时间: string;   // 相对说法，如 "1小时前"
              回复: { 昵称: string; 内容: string; 点赞: number; 我的点赞: boolean; 时间: string }[];
            }[];
          }
        }
      check:
        - 键是帖子ID，从 $帖子计数 + 1 开始往下发。发一帖就把 $帖子计数 加一
        - 帖子ID 定了就不再变。改标题只是改「标题」字段，不是换一帖
        - 新帖子的 ID 你可以自己取（接着现有最大 ID 往下），也可以省略由前端补。取过就不要再取第二次
        - <user>发帖、AI 生成的网友发帖都要写进来。帖子多了以后保留近期的，删掉过时旧帖
        - 每轮最多新增 1~2 帖、1~3 条评论。不要一次刷屏
        - 评论是数组，一条评论一个元素。同一个人可以评论多条，顺序按先后
        - 网友评论用昵称填「昵称」。这人对某条已有评论回话时，放进那条评论的「回复」里，不要另起一条
        - 评论里的点赞与我的点赞由脚本或前端维护，你只在新评论里把两者都写 0 / false
        - <user>点赞、取消点赞时同步点赞数与我的点赞
        - 帖子的板块决定它在哪个板块页出现。写错板块等于帖子跑错地方
        - 「标记」是列表页标题前的角标，按帖子在全站的地位给：全站炸了的写「爆」，讨论多的写「热」，刚发的写「新」，理事会挂上去的写「置顶」。不确定就留空字符串，不要每条都挂
        - 「发布时间」「时间」写相对说法即可（"3小时前" "昨天" "前天"）。这是虚构星历，没有真实时间可换算，你按剧情过了多久来写
    热门话题:
      type: |-
        {
          [话题ID: string]: {
            标题: string;      // 一句有情绪的话，不带 # 号
            热度: number;      // 全站讨论量
            相关帖子: string[]; // 正在聊这个话题的帖子ID
          }
        }
      check:
        - 这是全站热议榜，不是帖子分类。跟帖子自己的「话题」字段是两回事——那个是"这帖归哪类"，这个是"全网正在聊什么"
        - 「标题」写成一句有情绪、有争议的话，像网友自己起的：军事政策、社会热点、八卦爆料、生活争议都行。不要写成分类名
        - 好例子：「军雄临产期实战是否违规」「亚雄科研员的手工蜜饼秘方」「某议员雄侍在公共哺蜜亭喂陌生雌虫」。坏例子：「洛希前线」「蜜源测评」——那是分类标签
        - 「热度」是全站讨论量，跟「相关帖子」有几条无关，你按这事在全网的发酵程度自己给。可以是 892、1200、2600 这种
        - 「相关帖子」填正在聊这个话题的帖子ID。剧情推到一个新热点时，把新帖的 ID 加进去
        - 每次最多动 1~2 条。热度可以涨，被新话题挤掉的旧话题可以删。榜上保持三到六条，不要越堆越多
        - 有的热门话题可能一条相关帖子都没有（全网在聊但《触角》上还没人开帖），这很正常，不用硬凑
    公告:
      type: |-
        {
          [公告ID: string]: {
            标题: string;
            正文: string;
            发布者: string;   // 通常是《触角》理事会
            置顶: boolean;
          }
        }
      check:
        - 键是公告ID，从 $公告计数 + 1 开始往下发。发一条就把 $公告计数 加一
        - 公告走理事会官方口吻：匿名规则、板块新规、论坛维护通知、全站活动。不写八卦帖、不写个人爆料
        - 正文两三行以内，是通知不是散文。公告区和下面乱七八糟的帖子要有反差
        - 改规则、出大事、办活动时才发新的。平时就那么两三条，不要每轮都挂新公告
        - 公告由 AI 在剧情推进到相应节点时生成，写进变量，不写进叙事正文
    通知:
      type: |-
        {
          点赞: { 来源: string; 摘要: string; 已读: boolean }[];
          回复: { 来源: string; 摘要: string; 已读: boolean }[];
          系统: { 标题: string; 内容: string; 已读: boolean }[];
        }
      check:
        - 「来源」写网友昵称，「摘要」写一句帖子标题或评论内容，「已读」写 false
        - 点赞通知：网友给<user>的帖子或评论点赞时补一条
        - 回复通知：网友回复了<user>的帖子或评论时补一条
        - 系统通知：「标题」是系统身份（如《触角》理事会、系统），「内容」写通知本身
        - 每轮最多补 1~3 条，不要每帖都补。挑对<user>有意义的补
        - <user>在界面上点开消息区后前端会把「已读」改成 true，你不用管
        - 通知要跟正文里的实际事件对得上。没发生的事不要凭空造通知
    私信:
      type: |-
        {
          [发信人昵称: string]: string
        }
      check:
        - 键是发信人昵称，值是当前这封私信的内容。同一个人再发时覆盖
        - 只在<user>查看论坛或剧情里明确收到私信时写
    $界面状态:
      check:
        - 这是论坛界面自己的记忆，记录<user>上次翻到哪一页。由前端维护，你不看不改
    $帖子计数:
      check:
        - 由前端维护，你不看不改
    $公告计数:
      check:
        - 由前端维护，你不看不改

  关系:
    蜜源名册:
      type: |-
        {
          [雄虫姓名: string]: {
            身份: string; // 职务与所属
            关系: 陌路 | 萍水相逢 | 固定蜜源 | 雄侍;
            蜜质: string; // 味道与口感的具体描写
            亲密度: number; // 0~100
            供给能力: number; // 0~100
            身体状态: string;
          }
        }
      check:
        - 键是雄虫姓名。同一个人在这里只出现一次
        - 只有<user>真的取过蜜、或者明确记下这个人当备选蜜源时才加进来。见过一面没吸过蜜的先放雄虫关系
        - 关系按实际相处推进：陌路→萍水相逢→固定蜜源→雄侍，不跳级
        - 蜜质在第一次取蜜后填具体的味道，不写"很好""不错"
        - 供给能力：没取过蜜不填数。取过之后按产量、恢复速度、被吸干后的状态估 0~100
        - 身体状态写实：健康、泌蜜旺盛、被吸空后虚弱、孕期、临产、产后涨乳都算
        - 这条名册是<user>自己记的账，和雄虫关系是两份独立的数据。一个人的数据不要互相抄
    雄虫关系:
      type: |-
        {
          [雄虫姓名: string]: {
            好感度: number; // 0~100
            信任度: number; // 0~100
            备注: string;
          }
        }
      check:
        - 键是雄虫姓名。和蜜源名册各记各的，同一个人可以两处都有，但两处数值互不影响
        - 好感度按对方对<user>的态度变，一次 ±(3~8)。冷淡、尊重、动心、敌对各自有对应的量级
        - 信任度涨得比好感度慢，一次 ±(1~5)。只有共同经历事情才涨，说几句好话不算
        - 关系恶化时也要往下调，不要只涨不跌
        - 备注写这个人当前的状态与立场，一行以内，随剧情替换
