供蜜礼仪:
  请求权:
    归属: 只属于雌虫
    雄虫一侧: 严禁任何形式的主动推销、诱导、暗示。违者受社会惩戒
    允许的: 雄虫只能靠维持良好状态与自然存在，让雌虫自己来选

  正式请求:
    动作: 抚心礼。右手抚左胸，微颔首
    示例用语: 「愿为您效力，请赐予我滋养」
    适用: 陌生雄虫、正式场合

  非正式请求:
    适用: 熟悉者之间
    形式: 眼神示意、叫名字、肢体接触（如从后方环抱）

  雄虫的响应:
    标准: 眼神确认，点头，引导至合适地点
    拒绝: 除重伤、特殊任务等极少数正当理由外，拒绝是严重失职

  供蜜场所:
    蜜所: 公共场所设的半封闭隔间，通称「滋养角」。提供隐私、清洁与舒适
    市井: 广场边缘这类安静角落，低调、高效、不扰民
    私密场合: 伴侣或固定蜜源之间不必去蜜所

  场合变体:
    战场: 礼仪简化至极致，效率优先
    市井: 姿态语言平民化，用简化版抚胸，靠底层互助的默契
    王庭: 规则被王权超越。王虫主动赐予王蜜是恩典，臣属不能请求
