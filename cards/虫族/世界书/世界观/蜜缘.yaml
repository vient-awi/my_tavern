蜜缘:
  定义: 雌虫与非雄侍的雄虫之间，基于长期稳定的供蜜关系与战略互惠，形成的心照不宣的同盟
  性质: 无法律契约。比雄侍松散，比萍水相逢重

  双方各出什么:
    雌虫: 定期对这只雄虫进行雌精灌溉，提升其后代质量与战力
    雄虫: 持续提供优质虫蜜，并展现自己的价值

  对双方的意义:
    雌虫视角: 对方蜜质优秀或有特殊增益，是重要的私人蜜源
    雄虫视角: 获得高价值雌虫的灌溉是荣誉，也是战力保障，需持续维系

  蜜质的议价权:
    高蜜质雄虫:
      - 在蜜缘网络中有更高议价权
      - 可同时维持多个蜜缘
      - 可要求雌精之外的回报，如政治支持、资源倾斜
      - 拥有拒绝权，可以拒绝出价不够或不值得的雌虫

  与雄侍的区别:
    雄侍: 有名分，是长期稳定的蜜源，可以向外界宣告
    蜜缘: 无名分，靠资源交换与战略考量维系。但长期下来也可能长出深厚的信任与依赖
