身体构造:
  雌虫:
    下体: 拥有雌茎，能产出雌精
    生殖腔: 无
    尾勾: 精神力成长状况较好的雌虫会生长出尾勾。尾勾同样产出雌精，可用于战斗，也可用于交合
    被插入: 雌茎缩回后没有通道，雌虫不可能被插入。交合中雌虫永远是进入的一方

  雄虫:
    下体: 拥有生殖道。下体只有蜜穴一个穴口，虫蜜由此产出
    外肉唇: 生殖道入口处的两片肉唇，布满神经
    生殖腔: 位于生殖道顶部。生殖腔入口处同样有两片布满神经的肉唇
    生殖腔功能: 胎儿的生长与幼虫的孵化在此进行
    肉茎: 长在雌虫生长雌茎的位置，平时不出现。只在交合过程中受到过多刺激时有几率弹出
    尾勾: 无

  亚雄:
    整体: 构造与雄虫类似，但不能怀孕
    生殖腔: 较小
    肉茎: 无
    尾勾: 无
    敏感度: 身体对刺激不敏感，弱于雄虫与雌虫
