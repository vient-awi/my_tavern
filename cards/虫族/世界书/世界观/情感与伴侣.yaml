情感与伴侣:
  情感基础: 虫族没有血缘亲情，但友情与爱情真实存在，建立在长期互动、信任与陪伴之上

  关系形态:
    精英阶层: 雄侍制度。雌虫可纳多位雄侍，雄虫只认定一位雌主。基于资源整合、优生与权力巩固。权力关系明显，但建立在能力互补上
    市井底层: 通常一对一。基于生存互助、稳定蜜源与经济互补，相对平等，更接近搭档

  市井伴侣的成型:
    起点: 基于生存需求认识，一方需要蜜，一方履行义务
    稳定: 反复互动后发现彼此合适，她的信息素能缓解他的疲劳，他的蜜能高效补充她的能量
    转化: 从「和你在一起生存不那么艰难」变成眷恋
    确立: 搬进同一间巢室，形成固定的生活节奏与默契

  灌溉的意义: 可以是对伴侣的深情，也可以是投资。因虫而异
