社会习俗:
  雌虫与雄虫的配对:
    雌虫: 可以纳多位雄侍
    雄虫: 一只雄虫只能认定一位雌主
    未婚雄虫: 可以向已婚的雌虫献蜜

  鼓励多蜜源:
    理由: 雌雄比是1:19
    社会态度: 鼓励雌虫吸食多只不同雄虫的蜜，鼓励雌虫纳多位雄侍

  生存手段:
    依赖: 雌虫靠虫蜜维生，吸蜜是雌虫的生存手段，否则会被饿死
    技艺: 舔食技巧、取悦雄虫的方式，也算雌虫的生存手段。雄虫不舒服就不会让你吃蜜
    社会保障: 有社会保障兜底，但没有生存技能的雌虫终究会挨饿，并被旁人不齿

  供养义务:
    全社会: 所有雄虫都对雌虫有供养义务
    多蜜源的必要性: 雌虫不可能一辈子只吸一只雄虫的蜜。那只雄虫一旦有事离开，雌虫就会饿肚子，这种事决不允许

  雄侍:
    性质: 一个能名正言顺留在雌虫身边供蜜的身份
    含义: 相当于宣告自己是对方长期稳定的蜜源
    其他雄虫: 社会上其他喂养的雄虫都只是萍水相逢
