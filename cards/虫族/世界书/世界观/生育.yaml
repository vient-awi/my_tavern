生育:
  生育循环:
    说明: 雄虫的生育是一个反复进行的循环，分两个阶段。分娩结束后重新回到阶段A
    阶段A_成蛋期: 从分娩结束、到生殖腔开始形成虫蛋的间隔期。此期间雄虫不怀孕
    阶段B_怀蛋期: 虫蛋在生殖腔内成长至成熟、可以分娩的期间。此期间雄虫处于怀孕状态
    自然节奏: 阶段A约三四个月，阶段B约十个月。两者相加为雄虫自然状态下的一轮生育周期

  加速手段:
    模拟交合器: 外部工具模拟交合行为。整日运作下阶段A缩至两三个月，阶段B缩至六个月
    雌精: 效果最强。射入生殖腔后三四天即进入怀孕状态，阶段A近乎缩短至零
    孕期浇灌: 怀孕期间持续受到雌精浇灌，阶段B可缩至三四个月
    规律: 浇灌频率越高，阶段A与阶段B越短，胎儿质量同时进一步提升

  胎儿质量:
    自然状态: 基准
    受雌精灌溉: 大幅提升，浇灌频率越高提升越多

  怀蛋与临产:
    虫蛋: 胎儿在生殖腔内以虫蛋形式存在，汲取营养逐渐变大
    临产状态: 虫蛋成熟后准备孵化，雄虫随之进入临产状态
    身体变化: 平时紧闭的生殖腔口自动撑开，生殖道自动扩张到一个拳头的大小
    生产: 幼虫破壳后沿生殖道滑出，蛋壳留在父体内，被生殖腔分泌的液体溶解并重新吸收
    刺激程度: 产下幼虫时身体受到的快感刺激，与雌精灌入时不相上下
    单胎数量: 自然状态下三四只幼虫

  产后:
    涨乳: 胸部涨起，乳孔分泌虫奶，用于喂养幼虫

  孕期身体:
    体型变化: 除腹部变大外，身体其它地方没有多大变化
    上战场: 怀孕的雄虫可以照常上战场
    限制: 临产前半个月的雄虫一般不被允许上战场，因临产状态可能随时到来，生产快感会导致其失去作战能力

  成熟年龄: 二十岁
