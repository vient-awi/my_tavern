虫蜜:
  产地: 由生殖腔分泌
  分泌者: 雄虫与亚雄在身体成熟后均可自然分泌。亚雄的分泌能力比雄虫低不少，量也少得多

  储存与流出:
    储存: 分泌后储存在生殖腔内
    流出: 储存达一定量后经生殖道流出
    浓稠化: 在生殖腔道内是易流动的液态。经过外肉唇流出时，肉唇分泌的物质使其变得浓稠无比

  作为食物:
    唯一食物: 雄虫与亚雄分泌的虫蜜是雌虫唯一的食物
    索要: 雌虫在公众场所随时向雄虫索要虫蜜是合情合理的，雄虫不会拒绝
    吸食方式: 雌虫平时直接摄取吸食雄虫与亚雄体内的虫蜜
    体外储存: 体外储存的虫蜜质量变差、营养流失，一般只作为应急手段
    幼虫: 也可作为幼虫的食物。雄虫产下幼虫时生殖腔会喷涌大量虫蜜
    自用: 雄虫与亚雄也可消耗自身产生的虫蜜补充能量
    应急蜜膏: 社会保障发放的应急口粮，虫蜜的廉价替代品。只能吊命，不能让雌虫饱足，也补不回精神力。雌虫日常不吃这个

  口感差异:
    不同雌虫向不同雄虫注入雌精，得到的虫蜜口感不同

  蜜质的影响因素:
    身体状态: 健康、休息充足的雄虫蜜质好。带伤、过劳、生病的雄虫蜜质发苦发涩
    工作性质: 长期从事什么行当会渗进蜜味。军雄的蜜常带火药与铁锈气，文职的蜜清爽
    情绪: 情绪稳定时蜜质平稳。紧张、恐惧、抗拒会当场影响口感
    年龄: 壮年蜜质最好，太年轻偏淡，太老转薄

  促蜜手段:
    模拟交合器: 对雄虫可促使虫蜜分泌，且同时加速怀孕与生产进程。对亚雄效果微乎其微
    雌精: 可促使雄虫分泌大量虫蜜

  供养职责:
    雄虫与亚雄: 自生殖腔能产蜜的年龄起，肩负养育全社会雌虫的职责

  雌虫的饱食状态:
    刻度: 以十二为一轮的进食刻度。满为十二，零为濒临饿毙
    分布: 九到十二是饱足，状态最好。六到八是正常。三到五开始饿。一到二饿急了，体力与判断力明显下降。零是濒危，无法作战
    食量差异: 雌虫之间食量相差很大。有的雌虫一天取一次蜜就够，有的食量大、消耗快，需要频繁补蜜
    战力影响: 饥饿直接压缩精神力的输出。饱食度低时，精神攻击的威力与续航同时下降
    低度表现: 饿到三以下会开始分神，对附近雄虫的蜜味格外敏感。这是身体在催她进食
