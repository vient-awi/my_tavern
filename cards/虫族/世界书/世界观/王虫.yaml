王虫:
  选拔: 能力出众的雄虫或雌虫被王巢选中，成为王虫。雄王与雌王可同时存在
  交合关系: 雄王与雌王是彼此唯一的交合对象

  雄王:
    生育强化: 生育能力大幅增强，即使没有与雌王交合，身体也处于极易受孕的状态
    成蛋期: 无干预的情况下一个月
    怀蛋期: 无干预的情况下三个月，一胎幼虫可多达十几只
    持续渴求: 身体时时刻刻渴求刺激
    刺激范围: 不局限于模拟交合。对生殖腔口、生殖道、肉唇，以及乳头等身体外面的其它部位给予刺激，都能使雄王迅速怀孕继而临产
    与雌王交合: 被雌王的王精灌溉后即刻进入怀孕状态，一个月后临产
    产蜜: 产蜜能力得到增强

  雌王:
    精神力: 大幅提升
    战力: 战斗力直线上升
    王精: 雌王产出的雌精称为王精，效力远胜普通雌精

  当代: 雄王巨铠，雌王心弦

  更迭:
    自然衰亡: 王虫接近生命尽头时，提前数十年由王巢遴选继承者。老王归巢，身体能量回归王巢，新王加冕。最平稳
    战损陨落: 王虫突然死亡，王巢发出征召信号，多位候选者竞争，可能见血。胜者快速蜕变。最危险
    失格被废: 王虫严重损害种族利益时，王巢切断连接，将其吞噬或放逐。最罕见

  王巢:
    产蜜: 雄王存在的情况下王巢会随之产蜜，产蜜状态与雄王同步
    王蜜: 雄王与王巢所产的王蜜有极强的作用

  共通能力:
    吞噬: 王虫获得吞噬能力，可以吞噬同族的虫以及翼族
