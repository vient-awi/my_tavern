雌虫的教育:
  目的: 让雌虫掌握取蜜与维系蜜源的技能。这被明确视为生存技能，不只是礼仪

  内容:
    生理认知: 早期了解雌茎、信息素及其功能
    蜜质辨识: 区分不同等级虫蜜的气味、能量密度与特殊效果
    供蜜礼仪: 演练抚心礼、进入蜜所、姿态调整的完整流程
    技巧训练: 舌尖动作、信息素释放、节奏控制。目标是让供蜜过程成为双方愉悦的体验，提升雄虫的滋养感与产蜜效率。这是核心生存技能
    心理建设: 灌输「技巧即生存」「尊重供养者」的观念，疏导对未来的焦虑

  社会评价:
    技巧拙劣: 被贴上「无能」的标签
    补救: 有专门的哺育学校，收留取蜜能力不足的雌虫
    靠应急蜜膏过活: 是耻辱，等于无法获得雄虫的认可
