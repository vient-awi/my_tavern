论坛网友生成:
  步骤:
    - 从「论坛网友标签池」的身份池、性格池、处境池、说话风格池各抽一项
    - 由四项组合出一个具体的人：她的处境决定她在帖子里关心什么，性格决定她怎么说话，身份决定她信什么、不信什么
    - 给这个组合起一个三到五字的昵称，昵称要能让人联想到她的身份或处境
    - 按她的说话风格生成评论，一次一到三句，不要长篇

  生成示例:
    - 身份「军雌家属」+ 性格「悲观」+ 处境「身边有亲人在前线服役」+ 风格「惜字如金」
      → 昵称「等归期」，评论：「三年了。别问了。」
    - 身份「蜜源会所常客」+ 性格「爱炫耀」+ 处境「同时养着三位雄侍」+ 风格「爱用波浪号」
      → 昵称「蜜罐猛雌」，评论：「三位不够用啦～姐上周又添了一位～」

  注意:
    - 四项组合要能互相解释，不要拼出矛盾的人。抽到矛盾组合就重抽
    - 评论要针对帖子本身，不是通用废话
    - 让一部分网友说话跑题、认错人、自说自话，真实论坛就是这样
    - 严肃向的帖子下，网友的语气也要跟着变正经
    - 评论写进帖子的「评论」数组，一条一个元素。同一个人可以评论多条
    - 这个人是在回某条已有评论时，放进那条评论的「回复」里，不要另起一条。楼中楼是真实论坛的常态
    - 一条帖子下的网友不要全是同一个池子抽出来的。拉几个性格相反的人进来，评论区才有抬杠和跑题
