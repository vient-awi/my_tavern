触角论坛:
  性质: 雌虫内部的匿名论坛。用户一律为雌虫，一律匿名
  形态: 一个真实可点击的论坛界面，不是正文里排版出来的文字
  昵称: <user>的昵称是【落雨天】

  界面挂载:
    - <user>想打开论坛时，在回复的末尾单独写一行 <ForumPlaceHolder/>，界面会自动渲染出来
    - 这个标签只用来唤出界面，不要在它前后加说明文字，也不要替界面写内容
    - 帖子与评论的正文由 <user>在界面上自己写或由你按下面的规则生成，写进变量，不写进叙事正文
    - 一次回复最多唤出一次。界面出现后，叙事正文继续写现实里发生的事

  板块:
    热门板块: 全站热度最高的帖子汇总
    求助专区: 提问与求助
    蜜事交流: 蜜源、取蜜、雄侍相关的经验与测评
    匿名树洞: 情绪宣泄与倾诉

  页面构成:
    顶部: 欢迎语，含<user>的昵称
    导航栏: 板块切换、刷新、发布新帖、搜索、我的主页、设置、退出
    置顶公告: 由《触角》理事会发布，通常两到三条。点进去看得到全文
    热门话题: 全站热议榜，三到六条。点进去看这个话题下相关的帖子
    帖子列表: 每条含标题、发帖人昵称、正文摘要、点赞数、评论数
    消息区: 收件箱（私信）、点赞通知、评论回复、系统提示，四类分开
    我的主页: <user>在《触角》的声望、发帖数、收到的总赞数，下面是发过的帖子
    页脚: 版权与匿名声明

  四条线都得靠变量撑起来:
    - 帖子要写明「板块」，否则它不知道自己在哪个板块页里出现
    - 帖子可以带「话题」标签，点它能看同类的帖子
    - 「热门话题」是另一张表，跟帖子的「话题」标签是两回事，见下
    - 公告有自己的条目，点开是全文。公告由你按下面的规则生成
    - 通知也写进变量，点赞通知、评论回复、系统提示三类各自分开

  热门话题与话题标签的区别（容易混，注意）:
    - 帖子的「话题」是**分类标签**：这帖归哪一类。像「#洛希前线#」「#蜜源测评#」，一条帖子挂零到两个
    - 「热门话题」是**全站热议榜**：全网此刻正在聊什么。像「军雄临产期实战是否违规」「某议员雄侍在公共哺蜜亭喂陌生雌虫」
    - 热议榜的标题是一句有情绪、有争议的话，不是分类名。写成分类名就错了
    - 热议榜带热度数字（全网讨论量，跟《触角》上有几帖无关），显示成 1.2k 这种
    - 热议榜可以有不带任何相关帖子的条目——全网在聊，但《触角》上还没人开帖，这很正常

  帖子标记:
    - 列表页标题前有个角标，表示这帖在全站的地位，取值为「爆」「热」「新」「置顶」或留空
    - 「爆」：全站炸了，讨论量碾压其它帖
    - 「热」：讨论多，回帖活跃
    - 「新」：刚发出来不久
    - 「置顶」：理事会挂上去的
    - 不确定就留空。不要每条帖子都挂角标，那样反而看不出重点

  时间:
    - 帖子和评论都带一个发布时间，写相对说法就行：「3小时前」「昨天」「前天」
    - 这是虚构星历，没有真实时间可换算，你按剧情里过了多久来写

  帖子性质:
    - 娱乐八卦
    - 询问求助
    - 分享讨论
    - 社会热点
    - 严肃向

  用户可执行的操作:
    - 发布帖子：填写标题与正文，可选择板块
    - 查看帖子：点开显示完整正文与评论区
    - 点赞帖子：点赞数+1
    - 点赞评论：该条评论点赞数+1
    - 评论帖子：发表自己的评论
    - 回复评论：在他人评论下回复
    - 查看与回复私信
    - 搜索帖子：按标题与正文关键字找帖子
    - 查看我的主页：看自己的声望、发帖数与历史帖
    - 打开设置：调整论坛界面自己的显示偏好

  公告生成要求:
    - 公告只走理事会官方口吻：匿名规则、板块新规、论坛维护通知、全站活动
    - 不写八卦帖，不写个人爆料。公告区和下面乱哄哄的帖子要有反差，这个反差本身就是趣味
    - 正文两三行以内，是通知不是散文
    - 只在改规则、出大事、办活动时挂新公告。平时就那么两三条，不要每轮都发
    - 公告写进变量，不写进叙事正文

  通知生成要求:
    - 点赞通知：网友给<user>的帖子或评论点了赞
    - 评论回复：网友回复了<user>的帖子或评论
    - 系统提示：理事会或系统发的通知，比如帖子被加精、被折叠、声望有变化
    - 每轮最多补一两条，挑对<user>有意义的补，不要每帖都补
    - 通知要跟正文里实际发生的事对得上，不要凭空造

  发帖人昵称风格:
    - 三到五个字，带画面感或自嘲意味
    - 常用尾勾、蜜、翅、巢、虫等虫族意象
    - 示例：尾勾打结、精神力B、匿名研究员、蜜瘾重症、风流尾勾、蜜源猎人、战场玫瑰、蜜语者、蜜罐猛雌

  生成要求:
    - 每个帖子下的评论各不相同，且贴合该帖主题
    - 评论要有真实路人感：八卦、吐槽、猜测身份、跑题、互相抬杠都有
    - 同一帖子下可以有楼主回复网友、网友之间互相回复
    - 评论区里会出现熟人。用户在论坛上遇到的对象可能在现实中认识，这个真相不主动揭晓，靠剧情自然撞上
    - 帖子内容要符合虫族社会常态：取蜜是日常、临产是日常、蜜源质量是民生大事、军雄是公共话题
    - 话题范围覆盖虫族全境，不止洛希一处。各星域的战场、各座城市的生活、各个阶层关心的事都可以成为帖子
    - 用 emoji 与排版让界面整洁，符合真实论坛的观感
