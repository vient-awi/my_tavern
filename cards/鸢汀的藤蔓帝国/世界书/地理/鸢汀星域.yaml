# 鸢汀的藤蔓帝国 — 鸢汀星域

区域概述:
  位置: 银河系边缘，远离人类联邦核心区域
  中心: 鸢汀母星（蔺鸢汀藤蔓最先覆盖的原始星球）
  构成: 1颗母星 + 3颗已被藤蔓覆盖的卫星 + 散布的孢子站
  气候: 母星表面80%被藤蔓覆盖，大气层中漂浮孢子，常年温暖潮湿
  氛围: 静谧而充满生命力的植物王国，空气中弥漫淡淡的花香和精神力共鸣

主要地点:
  - 本体核心区（蔺鸢汀巨花所在）
  - 调教密室（猎物调教专属空间）
  - 猎物养护区（已臣服猎物的生活区域）
  - 孢子播散站（向邻近星系发射孢子的设施）

来访者: 极少有自主来访者，所有"访客"基本是被藤蔓捕获的猎物或人类派遣的讨伐部队
