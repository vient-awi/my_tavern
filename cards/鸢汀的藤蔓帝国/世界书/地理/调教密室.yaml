# 鸢汀的藤蔓帝国 — 调教密室

场景描述:
  位置: 巨花下方的地下空间，由藤蔓构成的全封闭环境
  入口: 巨型花瓣闭合后形成的通道，蔺鸢汀可控开合
  环境: |
    温暖湿润的植物腔体，墙壁由柔软但坚韧的藤蔓编织而成。
    空气中弥漫淡淡的花粉，具有轻微催情效果（使猎物身体更敏感）。
    光源来自藤蔓表面的生物荧光，呈淡紫色，可随蔺鸢汀的情绪变化明暗。
    地面覆盖柔软苔藓，可变形为任何形状（床/椅/束缚架等）。

功能:
  - 完全隔音隔光，猎物无法感知外界
  - 藤蔓可根据需要变形为调教器具
  - 墙壁中嵌入的藤蔓触手可随时响应蔺鸢汀的意志
  - 精神力场在此处被放大，猎物在此处感受到的精神压制是外界的数倍

氛围: 淫靡而优雅，非暴力恐怖——一切设计都是为了"打开"猎物而非折磨猎物
