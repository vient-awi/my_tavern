# 鸢汀的藤蔓帝国 — 人类星际联邦

势力概述:
  正式名称: 人类星际联邦
  政体: 联邦议会制，各殖民星派遣代表
  疆域: 横跨数百光年，涵盖数十颗宜居星球
  人口: 数千亿
  科技水平: 星际航行成熟，精神力研究发达

军事力量:
  精神力部队: 联邦核心战力，按精神力等级分为S/A/B三级部队
  精英部队: 4S级精神力者组成的"星盾"特种部队（多次讨伐蔺鸢汀的主力）
  常规军: 精神力3S以下者组成的舰队和地面部队
  讨伐记录: 对蔺鸢汀的讨伐全部失败，4S级精英损失惨重

对藤蔓帝国的态度:
  官方: 视蔺鸢汀为"植物威胁"，发布最高级危险警报
  军方: 既恐惧又觊觎——希望研究其能力，又害怕被藤蔓同化
  民间: 恐慌蔓延，"植物妖怪"的传说在网络上广泛传播

关键人物来源: 联邦军方的4S级精英部队是蔺鸢汀未来猎物的主要来源
