# 鸢汀的藤蔓帝国 — 本体核心区

场景描述:
  位置: 鸢汀母星的中心，一座被藤蔓覆盖的古老山脉之巅
  巨花: |
    蔺鸢汀的本体所在——一朵直径约20米的巨型花朵，花瓣半透明，
    泛着淡紫色的精神力荧光。花瓣中央是蔺鸢汀的人形上半身，
    长发散落在花瓣上，下半身与花蕊完全融合。
  藤蔓网络: 从巨花向四面八方延伸的藤蔓组成星球级神经网络，每一条藤蔓都是蔺鸢汀的触觉延伸
  精神力场: 核心区存在强烈的精神力共鸣场，进入此区域的人类会感到轻微眩晕和精神压制

关键特征:
  - 空气中精神力浓度最高，蔺鸢汀在此处汲取和消化精神力效率最高
  - 花瓣可开合，闭合时形成保护茧
  - 藤蔓王座：蔺鸢汀面前有由藤蔓编织的座席，通常林昊在此陪伴
  - 根系延伸至地心，可感知整颗星球的脉动
