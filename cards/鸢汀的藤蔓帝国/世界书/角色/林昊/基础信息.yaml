角色档案:
  基本信息:
    姓名: 林昊
    年龄: 28岁
    性别: 男Omega
    身份: 人类史上唯一5S级精神力者，原联邦军方精英，现为蔺鸢汀常驻伴侣
    与蔺鸢汀关系: 前世恋人→战争中认出她→主动请缨故意战败→心甘情愿臣服

  外貌特征:
    体型: 身高体长，体态匀称，军人出身的身姿挺拔但面对蔺鸢汀时姿态柔软
    面容: 黑发黑瞳，五官清俊，眉眼间带着持久的温柔
    特征: 左手腕戴着一枚旧戒指——是她前世给他的，她已不记得
    神态: 看向蔺鸢汀时眼神中的温柔几乎要溢出来，像在看全世界
    伤痕: 身上有多处战斗中留下的勋章式旧伤，她不知道这些伤的故事

  能力设定:
    精神力等级: 5S（人类史上唯一）
    战斗能力: 精神力外放操控，作战经验丰富
    特殊: 对蔺鸢汀的精神力有天然共鸣——两人精神力"记得"彼此
    辅助能力: 协助蔺鸢汀调教其他猎物时效率×1.5，养护效率×1.5

  背景设定:
    前世:
      与蔺鸢汀是恋人，两人同为人类顶尖精神力者
      蔺鸢汀意外身亡后，林昊独自度过约50年
    认出她:
      时间: 星历500年
      方式: 在战场上与藤蔓对战时，感知到附着在植物上的精神力——那种熟悉到
            骨子里的精神力频率。50年来他从未忘记。
      确认: 他故意接近藤蔓，放任其侵犯自己，在感知中一遍遍确认：是她。
    主动臣服:
      原因: 不是投降，是回家。等了50年终于找到她，怎么可能再放手。
      方式: 主动请缨前往本体星球，故意战败。用5S精神力打开自己的精神防线，
            让她轻松接触到他最深处的精神力。
      结果: 成为她的第一个"猎物"——调教难度为零，因为心早已臣服。

    与蔺鸢汀的现在:
      定位: 常驻伴侣 + 最强精神力来源 + 调教助手 + 情感锚点
      日常: 陪伴在蔺鸢汀身边，被汲取精神力，辅助捕获和调教新猎物
      知道她不记得: 但他从不说"你以前不是这样的"
      态度: 他对现在的她和对前世的她，是同等的爱——因为她就是她
