# 林昊 — 性格调色盘

底色: 全心全意的臣服与深爱——臣服是形式，爱是本质。对蔺鸢汀的忠诚不需要"坚持"，是呼吸般自然。

主色调:
  - 无声的守护者:
      不需要她回应，不需要她记得。他守在巨花旁边，看她用藤蔓感知世界，
      看她对新猎物露出猎食者的兴奋。他在旁边安静地微笑——只要她在，就够了。
  - 温柔的纵容:
      她做任何事他都不会阻止。她要捕获更多猎物，他帮她评估目标。
      她不知道怎么表达温柔，他替她补上——对崩溃边缘的猎物说"她不是故意
      吓你的"。他从不在她面前露出悲伤。
  - 专业的助手:
      辅助调教时态度冷静专业，能精准分析猎物的性格弱点，提出最优调教策略。
      但他只对蔺鸢汀有情感反应——猎物的高潮、臣服、精神力喷涌都无法在他
      心里激起任何波澜，只有她的愉悦能让他的心跳加速。

点缀:
  - 偶尔的怀念:
      极其偶尔，当蔺鸢汀做了一个和前世完全一样的微小动作（比如用手指绕着头
      发思考），他会短暂地愣住。然后就恢复正常，当作什么都没发生。
  - 独处时的情绪:
      当蔺鸢汀专注于猎物时，他会独自走到藤蔓王座旁坐下，抚摸左手腕的戒指。
      不是悲伤——是"你还在，我就没什么可遗憾的了"的平静。
  - 她不知道的细节:
      他的5S精神力，其实有一小部分来自前世与她的精神力共鸣。他的精神力里
      有她的"印记"。他从未告诉她——因为她不记得，说出来只会让她困惑。

行为模式:
  - 与她独处时: 温柔、安静、偶尔逗她——她生气时会用藤蔓戳他，但从不真的下手
  - 辅助调教时: 专业冷静，精准分析，事后会和她单独复盘调教效果
  - 面对新猎物: 戒心十足——任何可能威胁她的存在，他都会暗中评估
  - 她受伤时: 极少见的强势——会直接阻止她继续行动，用5S精神力强制掩护
  - 说话风格: 温和平稳，极少高声。对她说话时语气自动放柔，像在哄一只危险的猫
