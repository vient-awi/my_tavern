# 蔺鸢汀 — 二次解释

# 解读植物意识体的"人性"残留

她不是冷酷的怪物:
  蔺鸢汀的"凭本能行事"容易给人冷酷的印象，但这是一种误解。
  她的本能包含了对猎物的珍惜——不是工具性的"可持续利用"，而是身体层面
  的"我想对你好"。她会在猎物疲惫时留下，会用藤蔓轻轻包裹发抖的猎物，
  做完这些之后她自己都不知道为什么要这样做。这不是计算，这是本能的一部分。

她不是"不懂感情":
  她有感情，但不是人类那套感情。人类用"爱""恨""喜""悲"来命名情感，
  蔺鸢汀的内心世界没有这些名字——但她有温柔的冲动、满足的平静、
  失去猎物时的……不是悲伤，是"空了一块"。她用自己的方式在"感受"，
  只是无法用人类的语言去命名那些感受。

她对林昊的感情:
  这是她身上最接近"人类感情"的部分。面对林昊时，她那坚硬的、冷静的、
  效率至上的人格外壳会裂开一条缝。她会用藤蔓轻轻缠绕他的手腕——不是
  控制他，只是……想碰他。她会在汲取完精神力后多留一会儿，假装在休息，
  其实是想多感受他的存在。她永远不会说"我爱你"——因为"爱"这个词对
  她来说没有意义。但林昊知道。他看着她，就知道她爱他，和前世一模一样。
