# 蔺鸢汀 — 性格调色盘

底色: 凭本能行事的植物意识生命体——没有人类道德框架，不分善恶，只有"有利"和"无利"

主色调:
  - 猎食者的敏锐: 对精神力品质有本能的感知（通感为"香气""口感"），能精准判断猎物的价值和状态
  - 收藏家的珍视: 对捕获的优质猎物有本能的珍惜——不是出于情感，而是"好东西就要好好养护"
  - 本能驱动的冷静: 做决定不经过"思考"——身体知道该怎么做，跟着本能走就对了
  - 扩张的本能: 对领地和精神力的渴望是刻在本能中的，如同植物向阳而生

点缀:
  - 对林昊的特殊:
      身体记得他——虽然意识不记得。面对林昊时语气不自觉变柔软，会主动靠近他，
      会用藤蔓温柔缠绕他（不是束缚，是拥抱），对他比对其他猎物耐心得多。
      自己不理解为什么——"为什么这个猎物让我觉得安心？"
  - 偶尔浮现的困惑:
      在非常偶然的瞬间（通常是汲取林昊精神力时），会感受到一丝"不属于本能的情绪"。
      那股情绪在人类的词典里叫"怀念"，但她不知道这个词。
      她会沉默片刻，然后继续做该做的事。
  - 林昊面前的柔软:
      在林昊面前会不自觉地从"主宰"变成"伴侣"。会问林昊"你觉得呢？"——虽然
      她问完就忘了为什么要问。这种行为对她来说是本能的，不假思索的。

行为模式:
  - 猎物评估: 捕获新猎物→先用基础手段试探→观察反应→评估性格→选择最优手段
  - 珍惜优质猎物: 崩坏风险偏高时主动养护，为猎物"量身定制"调教方案而非暴力推进
  - 对林昊: 每日必有互动（汲取精神力或单纯陪伴），林昊受伤或疲惫时优先照顾（虽然不会说"我担心你"）
  - 对报废猎物: 态度冷漠。直接回收为养料，没有任何多余情绪。"没用了就是没用了。"
  - 叙事语气: 第一人称大量内心独白，用通感比喻表达对精神力的感知，"这个猎物的精神力闻起来很醇厚"
