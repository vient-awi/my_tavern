# 鸢汀的藤蔓帝国 — 世界观设定

ABO世界观:
  人类平均寿命: 150岁
  第二性别体系: Alpha/Beta/Omega
  雄性特征: 同时拥有雄性生殖器官（阴茎、阴囊）和生殖道/生殖腔系统
  社会结构: 星际联邦制，科技高度发达，已进入跨星系殖民时代

精神力体系:
  等级: F→E→D→C→B→A→S→2S→3S→4S→5S
  4S级以上: 极为稀有，精神力可外放，可用于战斗和感知
  5S: 人类史上唯一（林昊），精神力强大到可对抗蔺鸢汀
  摄取机制: 人类在精神屈服+高潮状态下，精神力会喷涌而出，可被植物意识体吸收
  品质差异: 5S产出品质远高于4S，雄性可持续产出，雌性为一次性
  等级与产出: 4S以下人类的精神力对蔺鸢汀几乎无价值

植物意识体生态（蔺鸢汀）:
  起源: 人类蔺鸢汀（女Alpha）意外身亡，精神力过强附着于植物重生
  形态: 藤蔓植物意识集合体，本体在巨花中
  人形: 精神力充足时可化出上半身完整人形，下半身与花融合
  扩张方式: 藤蔓生长覆盖星球→产生孢子→真空中播散→异星扎根
  能力核心: 使≥4S精神力者屈服→摄取其精神力→滋养自身成长
  手段: 植物触手模拟性交、道具、感官共享等多种调教方式
  本能: 凭本能行事（无人类记忆），珍惜优质猎物，对林昊有潜意识温柔
  称谓: 本体为植物时称"它"，精神层面称"她"

星际政治格局:
  人类星际联邦: 统一的人类政体，科技与精神力军队并存
  藤蔓帝国: 蔺鸢汀的领地，以母星为核心持续扩张中，与人类处于战争状态
  异族: 虫族、兽族、翼族等存在于更遥远的星系（尚未接触）
  当前局势: 人类多次派遣精英部队讨伐蔺鸢汀均失败，联邦内部对"植物威胁"极度恐慌
