# 鸢汀的藤蔓帝国 — 副本：兽族

解锁条件: 大境界达成荫期

兽族概述:
  形态: 人形兽类智慧生物（类似兽人），保留兽类的身体素质与感官敏锐度
  精神力特点: 与身体本能深度绑定——情绪高涨（愤怒、兴奋、恐惧）时精神力爆发式增长
  栖息地: 散布在银河系多个星系的游牧型文明

兽族层级:
  兽王: 精神力等同于4S~5S，部落首领
  兽将: 精神力等同于3S~4S，部落精英战士
  兽民: 精神力A~S级，普通部落成员

兽族特点:
  - 身体强度远超人类，可承受更高强度的调教
  - 精神力随情绪波动：调教中激发其情绪（愤怒→兴奋→臣服）可获取爆发性精神力
  - 兽族雄性的兽化特征（兽耳/尾巴/皮毛）是额外敏感区域
  - 本能强于理性，生理反应比人类更直接

对蔺鸢汀的价值:
  - 兽王是最优质的猎物之一：高精神力+高身体承受力+情绪爆发精神力
  - 兽族臣服后会成为忠诚的"守护兽"，可参与保卫藤蔓帝国
  - 兽族精神力更"热烈"，与人类精神力品质互补

特殊调教方式:
  - 利用兽族情绪波动：先激发其战斗本能（愤怒）→ 再转化为性兴奋 → 最终臣服
  - 兽耳/尾巴/皮毛的兽化区域是额外敏感点，可进行专项开发
  - 兽族更适合高强度的"征服型"调教：压制→屈服→认可→臣服
