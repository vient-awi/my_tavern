# 鸢汀的藤蔓帝国 — 副本：翼族

解锁条件: 大境界达蔽日期

翼族概述:
  形态: 有羽翼的人形智慧生物，体态优雅轻盈，部分个体能飞行于星空间
  精神力特点: 精神力与羽翼同源——羽翼是精神力器官的物理具现，展开时精神力场大幅增强
  栖息地: 高轨道空间站和低重力星球，极少登陆地面

翼族层级:
  天翼王: 精神力等同于5S（极稀有，可能仅1~2位）
  翼主: 精神力等同于4S，统治单颗星球的翼族社群
  翼卫: 精神力等同于3S~4S，翼主的护卫和精神伴侣
  翼民: 精神力A~S级，普通翼族

翼族特点:
  - 羽翼是精神和物理的双重敏感区域，同时是精神力器官
  - 性格高傲，视地面种族（包括人类）为"不会飞的可怜虫"
  - 精神力纯净度是所有种族中最高的，接近林昊的5S品质
  - 身体轻盈脆弱，承受力远不如人类和兽族（极易崩坏！）

对蔺鸢汀的价值:
  - 翼族精神力最纯净，品质等于甚至超过5S人类
  - 翼主的羽翼可被同化入蔺鸢汀的藤蔓网络，成为"空中精神力节点"
  - 捕获翼族需要低强度高精度的调教策略——他们是瓷器，不是铁块

特殊调教方式:
  - 羽翼开发: 翼族羽翼是最敏感的精神力器官，轻触即可引发精神力共鸣
  - 飞行控制: 用藤蔓束缚羽翼使其无法飞行，心理防线立即大幅下降
  - 低强度优先: 绝对不能使用羞耻调教和高阶道具——翼族极易崩坏
  - 感官共享是最佳选择: 通过精神链接让翼族感受蔺鸢汀维度的体验，颠覆其高傲
  - 养护需特殊处理: 羽翼受伤会永久影响精神力产出

警告:
  翼族是最高品质猎物，也是最脆弱的。
  捕获一个翼主比捕获十个4S人类更有价值，但前提是不能搞坏。
  建议仅在拥有丰富调教经验后挑战翼族副本。
