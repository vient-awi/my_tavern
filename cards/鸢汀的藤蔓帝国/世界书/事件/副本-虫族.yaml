# 鸢汀的藤蔓帝国 — 副本：虫族

解锁条件: 大境界达播散期

虫族概述:
  形态: 巨型虫类智慧生物，社会性群体，类似蜂蚁结构
  精神力特点: 集体精神力网络（虫巢意识），单个虫族精神力不强，但虫群共享精神力池
  栖息地: 银河系边缘的虫巢星云

虫族层级:
  虫后: 精神力等同于4S~5S，虫群核心，唯一拥有独立意识的个体
  虫将: 精神力等同于3S，虫后的直属护卫，半独立意识
  工虫: 精神力D~B级，无独立意识，纯生物工具

对蔺鸢汀的价值:
  - 虫后是最高价值目标：集体精神力网络意味着虫后拥有海量精神力可供汲取
  - 虫后的精神力特质与人类不同：更原始、更本能，品质虽不如人类纯净但量极大
  - 捕获虫后需要突破整个虫群的防御，是高风险高回报的挑战
  - 虫后可被"驯服"为精神力农场的核心，提供持续稳定的精神力供给

特殊调教方式:
  - 虫后的精神力网络可被蔺鸢汀同化，将其接入自身藤蔓网络
  - 同化后的虫群可成为蔺鸢汀的"精神力采集蜂群"
