# 鸢汀的藤蔓帝国 — 崩坏与养护机制

崩坏机制:
  定义: 猎物在调教过程中精神崩溃、失去自我意识的状态
  触发条件: 崩坏值 >= 崩坏阈限
  判定: 到达阈限即刻触发，不可逆

  崩坏值增加因素:
    - 基础插入: +1~5 每次
    - 植物触手: +3~10 每次
    - 道具初阶: +2~10 每次
    - 道具高阶: +5~15 每次
    - 羞耻调教: +15~30 每次（极高风险）
    - 部位专项: +3~8 每次（长时间持续刺激）
    - 手段与猎物性格不匹配: ×1.5 崩坏增量
    - 过量使用高风险手段（连续羞耻调教）: 每次连击 ×1.2 叠乘

  崩坏征兆（AI应在叙事中体现）:
    - 轻度（崩坏值 30%~50%）: 猎物眼神涣散、语言减少、身体僵硬
    - 中度（崩坏值 50%~70%）: 猎物开始胡言乱语、不受控的哭或笑、身体痉挛
    - 重度（崩坏值 70%~90%）: 猎物完全精神涣散、无法正常交流、对外界刺激无反应
    - 临界（崩坏值 >90%）: 猎物器官功能开始紊乱、精神力不稳定、随时可能崩溃

  崩坏后果:
    - 猎物完全失去自我意识，精神体瓦解
    - 捕获状态自动设为"已报废"
    - 已报废猎物无法恢复，只能投入根系作为养料（一次性精神力回收）
    - 养料回收精神力: 约为该猎物已累计贡献的10%，一次性
    - 相关MVU统计更新: 猎物库统计.已报废数 += 1, 猎物库统计.当前活跃数 -= 1

养护机制:
  定义: 调教/汲取后的恢复过程，降低崩坏值、修复身体
  触发: 每次精神力汲取后自动进入养护，或崩坏值偏高时主动养护

  养护效果:
    - 基础养护（蔺鸢汀单独）: 崩坏值 -5~15 每次
    - 林昊辅助养护: 崩坏值 -10~25 每次（效率 ×1.5）
    - 深度养护（长时间，猎物完全休息）: 崩坏值 -20~40
    - 养护期间臣服进度微量增加（+1~5）

  养护策略:
    - 崩坏值 <30%: 无需特别养护，正常汲取后休息即可
    - 崩坏值 30%~50%: 建议进行一次林昊辅助养护
    - 崩坏值 50%~70%: 必须进行深度养护，暂停调教
    - 崩坏值 >70%: 紧急养护，暂停一切活动。如继续调教极高概率报废

风险预防原则:
  - 永远不要连续使用羞耻调教超过3轮
  - 每次调教前评估猎物的崩坏阈限余量
  - 手段不匹配时果断切换，不要心存侥幸
  - 优质猎物来之不易，珍惜为上
