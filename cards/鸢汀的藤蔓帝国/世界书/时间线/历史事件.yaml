# 鸢汀的藤蔓帝国 — 历史事件

前世:
  时间: 星历约480年
  事件: 蔺鸢汀（女Alpha）与林昊（男Omega）是恋人，两人同为人类顶尖精神力者
  意外: 蔺鸢汀在一次事故中身亡，精神力过强无法消散

重生:
  时间: 不详（约星历485-490年）
  事件: |
    蔺鸢汀的精神力意识附着于一株藤蔓植物，获得重生。
    失去全部人类记忆，仅保留本能和一丝模糊的情感残余。
    初期精神力极弱，仅能控制一株小藤蔓。

扩张期:
  时间: 星历490-500年
  事件: |
    - 通过本能摸索，发现可通过模拟性交让人类屈服并摄取精神力
    - 从一株藤蔓生长到覆盖整颗星球
    - 发展孢子播散技术，向邻近星球扩张
    - 精神力含量不断突破，解锁更高级的调教能力

与人类的战争:
  时间: 星历500年
  触发: 藤蔓扩张到人类星际联邦的殖民星域，与人类发生冲突
  经过: 人类多次派遣精英部队讨伐本体所在星球，无一归还
  关键事件: 林昊在战场上认出了附着于植物上的蔺鸢汀的精神力特征

林昊的到来:
  时间: 星历501年初
  事件: |
    林昊确认植物意识体就是蔺鸢汀的精神力残留后，主动请缨前往本体所在星球。
    他故意战败，放任藤蔓侵犯自己，用自身的5S精神力与蔺鸢汀建立深层精神链接。
    蔺鸢汀虽然不记得他，但身体本能地对他表现出异常的温柔。
    林昊心甘情愿成为她的常驻伴侣。

当前:
  时间: 星历501年
  状态: |
    蔺鸢汀处于"萌芽期"，拥有常驻伴侣林昊。
    藤蔓帝国继续扩张中，人类联邦处于恐慌状态。
    蔺鸢汀需要更多高精神力猎物来滋养自身成长。
