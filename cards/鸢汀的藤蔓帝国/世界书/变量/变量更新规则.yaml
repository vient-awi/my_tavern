# 鸢汀的藤蔓帝国 — 变量更新规则
# `_` 前缀变量为派生变量，AI 只读不写。`$` 前缀隐藏，AI 不可见。
# 路径格式为 JSON Pointer（/分隔），不含 stat_data 前缀。
# 同类变量用 ${name} 表示动态键占位。

# ============================================================
# 蔺鸢汀 — 玩家状态
# ============================================================

蔺鸢汀.精神力含量:
  type: number
  range: ">=0"
  check: |
    - 每次从猎物摄取精神力后累加：含量 += 本次摄取值
    - 摄取量 = 猎物精神力产出品质系数 × 淫荡度系数 × 臣服系数
    - 品质系数：5S=100, 4S=20
    - 淫荡度系数 = 1 + 猎物.淫荡度 / 500
    - 臣服系数：抵抗=0.5, 动摇=0.7, 顺从=1.0, 依恋=1.5, 臣服=2.0
    - 当 精神力含量 >= _精神力上限 时，schema transform 自动执行：含量清空（减去上限），_当前小阶+1
    - 当 _当前小阶 达到 10 时，自动重置为 1，_当前大境界 晋升至下一级，_精神力上限 ×10
    - AI 只需累加含量，无需手动处理晋升逻辑（由 transform 自动派生 _当前大境界 / _当前小阶 / _精神力上限）

蔺鸢汀.已解锁能力（待定）:
  type: string[]
  check: |
    随大境界自动添加，不要手动删改：
    - 萌芽期：["基础插入"]
    - 扎根期：追加 "植物触手"
    - 攀援期：追加 "道具初阶" "孢子播散"
    - 播散期：追加 "触手进阶" "部位开发"
    - 成荫期：追加 "感官共享" "道具高阶"
    - 蔽日期：追加 "身体改造"
    - 天罗期：追加 "多猎物同时调教"
    - 归元期：追加 "远程调教" "精神力吞噬"
    能力列表仅增不减。

蔺鸢汀.已控制星球数:
  type: number
  check: 每覆盖一颗新星球时 +1。当 _当前大境界 晋升时通常伴随星球数增长。

蔺鸢汀.本体位置:
  type: string
  check: 移动本体时更新。通常在跨星球扩张时变更。

# ============================================================
# 林昊 — 常驻伴侣
# ============================================================

林昊.精神力品质:
  type: string
  check: 固定 "5S"，永不改变。

林昊.淫荡度:
  type: number
  range: ">=0"
  check: |
    规则与猎物库相同（见下方 淫荡度 统一规则）。
    林昊特殊：
    - Omega体质使每次刺激的淫荡度增量 ×1.5
    - 5S精神力品质使高潮事件额外 +2~5
    - 永远不会崩坏，淫荡度可无限累积无风险

林昊.高潮值:
  type: number
  range: ">=0"
  check: |
    规则与猎物库相同（见下方 高潮值 统一规则）。
    林昊特殊：高潮阈值固定 50（Omega身体天生敏感，比普通猎物低一半）。

林昊.高潮阈值:
  type: number
  range: ">=1"
  check: 固定 50，不随调教改变。林昊的Omega体质使其极易达到高潮。

林昊.部位.${乳头|胸部|口腔|阴茎|阴囊|尿道|后穴|生殖道|肉珠|肉唇|生殖腔}.开发度:
  type: number
  range: ">=0"
  check: |
    规则与猎物库相同（见下方 部位开发度 统一规则）。
    林昊特殊：Omega体质使增量 ×1.5，改造阈限极低（所有部位 50）。

林昊.部位.${乳头|胸部|口腔|阴茎|阴囊|尿道|后穴|生殖道|肉珠|肉唇|生殖腔}.改造阶段:
  type: string
  check: |
    开发度达阈限后手动提升：
    - 开发度 >= 改造阈限 → 改造阶段: "已改造"（敏感度 ×2）
    - 开发度 >= 改造阈限 × 3 → 改造阶段: "深度改造"（敏感度 ×5）
    林昊的改造阈限极低：所有部位 50（Omega 体质天生到位）

林昊.当前状态:
  type: string
  check: |
    - 待命中：可用状态
    - 养护中：刚被汲取完精神力，正在修复
    - 辅助捕获中：协助蔺鸢汀捕获/调教其他猎物
    - 休息中：林昊自身休息

林昊.最近产出品质:
  type: string
  check: |
    每次汲取后评估：
    - 极佳：高潮强度强 + 淫荡度高 + 完全臣服状态
    - 优秀：高潮强度中以上
    - 良好：正常产出
    - 一般：状态不佳或刚养护完

# ============================================================
# 猎物库 — z.record 动态键
# ============================================================

猎物库.${猎物名}.精神力品质:
  type: string
  check: 生成时设定，"4S" 或 "5S"，之后不变。

猎物库.${猎物名}.ABO性别:
  type: string
  check: 生成时设定，Alpha/Beta/Omega，之后不变。

猎物库.${猎物名}.职业:
  type: string
  check: 生成时设定，如"帝国将军""星际海盗""联邦特工"等。

猎物库.${猎物名}.性格特征:
  type: string
  check: 生成时设定，描述性格特点（决定哪种调教方式更有效）。

猎物库.${猎物名}.身体素质:
  type: string
  check: 生成时设定，描述身体特征（影响部位开发速度和淫荡度增长率）。

猎物库.${猎物名}.阈限.${动摇|顺从|依恋|臣服|崩坏}:
  type: number
  check: 生成时根据猎物背景设定。意志坚定者阈限高，精神力越强者臣服阈限越高。

猎物库.${猎物名}.阈限.${乳头改造|胸部改造|口腔改造|阴茎改造|阴囊改造|尿道改造|后穴改造|生殖道改造|肉珠改造|肉唇改造|生殖腔改造}:
  type: number
  check: 生成时根据猎物身体素质设定。生殖腔改造阈限始终最高。

猎物库.${猎物名}.捕获状态:
  type: string
  check: |
    状态流转：
    - 未捕获 → 拘束中（初始捕获）
    - 拘束中 → 调教中（开始调教）
    - 调教中 → 已臣服（臣服阶段=臣服 且 调教完成）
    - 调教中/已臣服 → 养护中（精神力汲取后的恢复期）
    - 养护中 → 调教中（恢复完毕重新开始）
    - 任意状态 → 已报废（崩坏值 >= 崩坏阈限，不可逆）

猎物库.${猎物名}.臣服进度:
  type: number
  check: |
    === 臣服进度增减原则 ===
    臣服进度衡量猎物对蔺鸢汀的总体屈服程度。
    它是"身体诚实 + 心理防线瓦解 + 边界被突破"的综合结果，允许双向变动。

    ## 增量判定（按增量等级，而非技法名称）：

    【大幅增长 +20~40】——触及猎物最核心防线或带来质变性突破：
      - 私密空间首次被突破（器官分别首次被进入）
      - 在猎物重视的观众面前暴露调教状态
      - 从"将军/长官"的社会身份被彻底还原为"正在被操的人"
      - 在被俘虏/战败的战友面前被调教
      - 身体被写入情纹/烙印等永久性标记

    【显著增长 +10~25】——突破猎物的主动防线：
      - 嘴巴拒绝但身体主动迎合（穴口收缩挽留、腰不自觉抬高）
      - 在不应期仍被继续刺激导致失控反应
      - 被持续挑逗到忍不住主动开口恳求
      - 小腹被顶出藤蔓轮廓（视觉证据——身体在为蔺鸢汀变形）
      - 身体被藤蔓完全操控做出蔺鸢汀想要的动作
      - 感官共享中被迫同步感受蔺鸢汀的快感
      - 多人同时调教中被迫与其他猎物产生"竞争"或"比较"

    【中等增长 +5~15】——推进调教深度但未触及根本：
      - 新体位/新手段的首次使用
      - 高潮中被迫说出特定话语
      - 身体改造后的部位首次被深入刺激
      - 在调教中被要求评价自己的身体反应
      - 养护中夹杂调教成分（刚被温柔对待又被突然刺激）

    【小幅增长 +1~5】——常规调教的自然累积：
      - 单纯插入系（不含突破性边界）的常规抽插
      - 养护系手段（后戏温存、共食仪式等）
      - 感官共享等精神链接手段
      - 已习惯的调教手段的重复使用（收益递减，每次重复时在上限方向减半）
      - 获取高潮后的精神力时伴随的微量臣服增长

    【不变 0】——以下情况臣服进度不增长：
      - 纯养护/休息场景中无任何调教行为
      - 猎物处于昏迷/休眠状态
      - 仅进行非接触性的观察/监视
      - 精神力汲取本身（不含调教过程）

    【小幅下降 -1~5】——猎物心理防线短暂加固：
      - 调教后猎物独处时重新整理心理防线
      - 手段与猎物性格严重不匹配导致反感（同时崩坏值大幅上升）
      - 猎物的社交支持系统被触及（如得知自己的队友/家族近况）
      - 长期未被调教（猎物>7天处于待机状态）

    【显著下降 -5~15】——猎物经历重大心理逆转：
      - 同僚/同伴被蔺鸢汀报废（恐惧压倒臣服，心理退缩）
      - 养护过度（被过度呵护后反而怀疑蔺鸢汀的意图）
      - 蔺鸢汀在猎物面前展现出对已报废猎物的冷漠态度
      - 猎物被允许短暂"自由"后再次捕获（自由体验唤醒了抵抗意志）
      - 臣服进度不会降至负数，最小为0

    ## 修正系数：
      - 阶段阻力：猎物当前臣服阶段越高 → 增量 × (1 - 当前阶段序号×0.1)
        抵抗(×1.0) → 动摇(×0.9) → 顺从(×0.8) → 依恋(×0.7) → 臣服(×0.6)
        越接近完全臣服，每次进展越小
      - 匹配度：手段与猎物性格匹配 → ×1.5；一般 → ×1.0；不匹配 → ×0.5
        判断依据：猎物性格特征中提到的弱点/偏好是否被当前手段精准击中
      - 淫荡度系数：1 + 猎物.淫荡度/500
      - 高潮加成：场景以猎物高潮收尾 → 增量 ×1.3
      - 首次加成：该猎物首次经历某类调教手段 → ×1.5（仅第一次触发，之后不再加成）

猎物库.${猎物名}.臣服阶段:
  type: string
  check: |
    由 schema transform 自动派生，AI 不要手动更新此字段。
    AI 只需更新 臣服进度，transform 自动比较进度与猎物自身的阈限后输出对应阶段：
    - 臣服进度 < 动摇阈限 → "抵抗"
    - 臣服进度 >= 动摇阈限 且 < 顺从阈限 → "动摇"
    - 臣服进度 >= 顺从阈限 且 < 依恋阈限 → "顺从"
    - 臣服进度 >= 依恋阈限 且 < 臣服阈限 → "依恋"
    - 臣服进度 >= 臣服阈限 → "臣服"
    臣服阶段允许因进度下降而回退（如从"动摇"退回"抵抗"），但"臣服"阶段后不会回退（已彻底屈服）。

猎物库.${猎物名}.崩坏值:
  type: number
  range: ">=0"
  check: |
    === 崩坏值增减原则 ===
    崩坏值衡量猎物精神层面的损伤累积。崩坏不是痛苦——而是"被过度拆解到无法重新组装"。

    ## 增量触发条件（按风险等级）：

    【高风险 +15~30】——触及猎物核心心理防线的行为：
      - 在猎物重视的观众面前暴露调教状态 → +20~30
      - 手段与猎物性格严重不匹配（如对自尊心极强的猎物使用公开羞耻）→ +20~30
      - 生殖腔突破/身体改造操作中未给足适应时间 → +15~25
      - 让猎物被迫伤害/背叛自己关心的人 → +20~30
      - 多人同时调教且猎物从未经历过 → +20~30（初次冲击最大，后续递减）

    【中高风险 +10~20】——超越猎物当前承受力但结构尚在：
      - 调教强度过高：单次场景跨越多个维度（如边插入边支配边公开）→ +10~20
      - 连续多轮调教无养护间隔 → +15~25（疲劳累积效应）
      - 身体改造操作本身 → +10~20（改造完成后崩坏值可缓慢恢复）
      - 高潮后敏感插入或不应期操控 → +10~20

    【中风险 +5~15】——正常调教的常规损耗：
      - 突破新的身体边界（首次双通道、首次腔口突破等）→ +8~15
      - 道具系的强度较高手段（灌肠、电击贴片等）→ +5~12
      - 触手系多点同时刺激强度大 → +5~12
      - 猎物仍处于"抵抗"阶段时任何调教手段的基础损耗 → +5~10

    【低风险 +1~5】——温和的、生理层面的微量损耗：
      - 单纯插入系（不含生殖腔突破）→ +2~5
      - 养护系中涉及调教成分的手段 → +1~3
      - 感官共享等精神链接手段 → +1~5
      - 猎物已进入"依恋"阶段后的常规调教 → +1~3（心理防线已基本消失）

    ## 崩坏值降低（恢复）：

    【养护恢复 -5~20】——在养护场景中：
      - 单纯休息/睡眠 → -5~10（每4小时）
      - 后戏温存（拥抱、抚摸、低声交谈）→ -5~10
      - 花蜜品鉴/共食仪式等植物系养护 → -10~15
      - 记忆整理/精神力共振疗愈 → -10~20
      - 养护期间无任何调教行为 → 恢复速率 ×1.5

    【被动恢复 -1~5】——非养护场景：
      - 猎物处于休眠/昏迷状态 → -1~3（每日）
      - 猎物在安全环境中独处 → -1~5（每日）

    ## 修正系数：
      - 手段与猎物性格不匹配 → 崩坏值增量 ×1.5
      - 手段与猎物性格匹配度一般 → 崩坏值增量 ×1.0
      - 手段与猎物性格高度匹配 → 崩坏值增量 ×0.7
      - 猎物处于"抵抗"阶段 → ×1.2（心理防线完整时每次突破都额外消耗）
      - 猎物处于"依恋/臣服"阶段 → ×0.5（心理防线已消失，只剩生理损耗）
      - 单次场景跨越维度≥3 → ×1.5（复合刺激的协同崩坏效应）

    ## 崩坏触发：
      崩坏值 >= 崩坏阈限 → 猎物精神崩溃，捕获状态设为"已报废"，不可逆。
      AI 应在崩坏值接近阈限 80% 时在叙事中暗示猎物状态恶化（眼神涣散、反应迟钝、无端流泪等）。

猎物库.${猎物名}.高潮值:
  type: number
  range: ">=0"
  check: |
    === 高潮值增减原则 ===
    高潮值衡量猎物当前的实时唤起程度，是一个在调教场景中持续波动的"快感计"。
    受淫荡度系数加成：1 + 猎物.淫荡度/500
    当高潮值 >= 高潮阈值时触发高潮，高潮后高潮值重置为 0（或连续高潮时重置为 20~30）。

    ## 增量判定（按刺激强度）：

    【极强刺激 +15~25】——最敏感的刺激方式：
      - 生殖腔被突破或直接进入 → +20~25
      - 冠头研磨（性器冠头锁定在最敏感点持续研磨）→ +15~25
      - 高潮后敏感插入（不应期继续刺激）→ +15~25
      - 触手吸盘对乳头/肉珠等敏感点的定向吸附 → +15~20

    【强刺激 +10~20】——高强度的直接性刺激：
      - 阴茎/后穴/生殖道的快速抽插 → +10~20
      - 触手多部位同时刺激 → +12~20
      - 道具系高强度手段（灌肠器、电击贴片等）→ +10~18
      - 多人同时调教中被多位角色刺激 → +10~20
      - 感官共享中主动接收蔺鸢汀传来的快感 → +10~18

    【中等刺激 +5~12】——常规的性刺激：
      - 乳房/口腔/尿道等非核心性器官的挑逗 → +5~10
      - 触手全身缠绕按摩 → +5~12
      - 藤蔓鞭的轻微抽打 → +5~10
      - 孢子迷雾/场景系被动刺激 → +3~8
      - 藤蔓波浪蠕动（慢速）→ +5~10

    【轻度刺激 +1~5】——边缘性的、非直接的性刺激：
      - 爱抚/按摩/涂油 → +1~5
      - 言语挑逗/羞辱 → +1~5
      - 视觉刺激（被强迫观看他人调教）→ +1~5
      - 养护系中夹杂的轻柔触碰 → +1~3

    ## 高潮值降低（自然衰减）：
      - 刺激完全中断 → -5~15（每5分钟，取决于淫荡度：淫荡度越高衰减越慢）
      - 淫荡度 >= 500 → 衰减速率减半（身体已高度敏化，难以"冷静"）
      - 养护系手段 → -10~20（花蜜品鉴、桑拿浴等主动降低唤起）

    ## 高潮触发：
      高潮值 >= 高潮阈值 → 猎物达到高潮 → 高潮值重置为 0
      例外：连续高潮时重置为 20~30（保留部分唤起以允许"连潮"）
      淫荡度每 +200 → 高潮后重置值 +5（身体敏化使不应期缩短，更容易连潮）

    ##器官部位改造阶段对高潮值增量的影响：
        未改造 → 正常增长
        已改造 → 刺激该部位获得的增量 ×1.5（已改造部位更容易继续深度开发）
        深度改造 → 刺激该部位获得的增量 ×2.0（已成为精神力器官，响应极快）

    ## 高潮阈值：
      生成时根据猎物身体素质设定，典型范围 80~200：
      - 身体敏感、精神力品质高的猎物 → 80~100
      - 普通猎物 → 100~150
      - 身体迟钝、意志力强的猎物 → 150~200

猎物库.${猎物名}.高潮阈值:
  type: number
  range: ">=1"
  check: 生成时设定。林昊固定 50，普通猎物 80~200。随淫荡度增长缓慢降低（见 高潮值 规则）。

猎物库.${猎物名}.淫荡度:
  type: number
  range: ">=0"
  check: |
    === 淫荡度增减原则 ===
    淫荡度衡量猎物身体的敏感化程度——身体对性刺激的响应越来越快、越来越强。它代表了猎物的"身体记忆"：被开发得越多，身体越懂得如何感受快感。

    ## 增量判定（按刺激维度）：

    【高潮事件 +3~15】——高潮是淫荡度增长的最强驱动力：
      - 单次调教场景中首次高潮 → +3~8
      - 同一场景中连续第二次高潮 → +5~12（不应期被突破，身体被强制连续响应）
      - 强制连续高潮（连续3次以上）→ +10~15（身体学习到了"极限是可以被重新定义的"）
      - 生殖腔高潮 → +8~15（最深处的快感神经被激活）
      - 林昊专属：5S精神力品质使每次高潮额外 +2~5

    【持续刺激 +1~8】——非高潮的常规刺激累积：
      - 单一部位被持续刺激超过5分钟 → +2~5（神经末梢密度上升）
      - 多部位同时刺激 → +3~8（神经通路建立跨部位连接）
      - 调教中高潮边缘被反复悬停 → +3~6（身体学会在高唤起状态维持）
      - 场景系环境被动刺激（孢子迷雾、温度变化等）→ +1~3
      - 被观察/被监听的状态下接受刺激 → +1~3（羞耻感加速敏化）

    【被动增长】——非直接刺激的敏化：
      - 身体改造后的部位被触碰 → 基础增量 ×2（已改造）/ ×5（深度改造）
      - 长期处于调教环境中（日常被藤蔓环绕）→ +1~3（每日被动增长）
      - 精神力链接/感官共享中感受到蔺鸢汀的快感 → +1~5

    ## 淫荡度的效果：
      - 精神力产出系数 = 1 + 淫荡度/500
        淫荡度100 → 产出×1.2，淫荡度1000 → 产出×3
      - 高潮阈值降低：淫荡度越高，猎物越容易达到高潮（AI 在叙事中体现）
      - 部位开发速度：淫荡度每+500 → 部位开发度增长率 +10%（身体整体敏化加速专项开发）
      - 无上限：体现猎物身体在持续调教下的无限进化潜力

    ## 林昊特殊规则：
      林昊的淫荡度增长规则与普通猎物相同，但：
      - Omega体质使每次刺激的淫荡度增量 ×1.5
      - 5S精神力品质使高潮事件额外 +2~5
      - 永远不会崩坏，所以淫荡度可无限累积无风险

猎物库.${猎物名}.部位.${乳头|胸部|口腔|阴茎|阴囊|尿道|后穴|生殖道|肉珠|肉唇|生殖腔}.开发度:
  type: number
  range: ">=0"
  check: |
    === 部位开发度增减原则 ===
    部位开发度衡量特定身体部位被调教、敏化、改造的累积进度。每个部位独立追踪。

    ## 增量判定（按刺激精度）：

    【专项刺激 +10~25】——该部位是调教的唯一或主要目标：
      - 道具系精准器具（吸乳器对乳头、灌肠器对后穴等）→ +10~20
      - 冠头/触手定点对该部位持续研磨 → +10~20
      - 触手首次突破/叩门 → +20~40
      - 触手对该部位的专项开发（吸盘、波浪蠕动等）→ +10~20
      - 多位猎物同时被刺激同一部位 → 每位猎物 +10~18

    【涉及刺激 +3~10】——该部位被纳入但不是当前焦点：
      - 触手缠绕全身时该部位被包裹/摩擦 → +5~10
      - 插入过程中腔壁摩擦波及邻近部位 → +3~5
      - 养护中该部位被轻柔按摩 → +2~5
      - 环境因素间接刺激（孢子迷雾接触皮肤/粘膜）→ +2~5

    【被动增长 +1~5】——非直接刺激的缓慢累积：
      - 身体改造后该部位敏感度翻倍，此后每次涉及刺激的增量 ×1.5
      - 长时间道具佩戴（贞操笼、肛塞、口枷）→ 每日 +1~2
      - 精神力链接将蔺鸢汀的快感映射到该部位 → +2~5

    ## 增长速度修正：
      - ABO性别影响：Omega ×1.2 > Beta ×1.0 > Alpha ×0.7
        （Omega天生身体更易被开发，Alpha需要更多努力）
      - 淫荡度加成：每500淫荡度 → 增量 +10%

    ## 各部位开发难度（指导AI安排优先级）：
      - 低难度（快速见效，适合初期）：肉珠、乳头、肉唇、口腔
      - 中难度（需要一定基础）：阴茎、后穴、尿道、阴囊、胸部
      - 高难度（需要猎物较高臣服度）：生殖道
      - 极高难度（需要猎物进入依恋/臣服阶段）：生殖腔

猎物库.${猎物名}.部位.${乳头|胸部|口腔|阴茎|阴囊|尿道|后穴|生殖道|肉珠|肉唇|生殖腔}.改造阶段:
  type: string
  check: |
    开发度达阈限后手动提升：
    - 开发度 >= 改造阈限 → "已改造"（敏感度 ×2）
    - 开发度 >= 改造阈限 × 3 → "深度改造"（敏感度 ×5）

猎物库.${猎物名}.最近产出品质:
  type: string
  check: 每次汲取后评估。品质 = 精神力品质(S/4S) × 臣服阶段修正 × 高潮强度 × 淫荡度修正。

猎物库.${猎物名}.累计贡献精神力:
  type: number
  check: 每次汲取后累加本次摄取值。

猎物库.${猎物名}.捕获日期:
  type: string
  check: 捕获时设定，格式"星历501/01/01"。

# ============================================================
# 猎物库统计 — 聚合数据
# ============================================================

猎物库统计.总捕获数:
  type: number
  check: 新增猎物时 +1。初始=1（含林昊）。

猎物库统计.已臣服数:
  type: number
  check: 任意猎物（含林昊）臣服阶段=臣服 时 +1。报废的不从此数减去。

猎物库统计.已报废数:
  type: number
  check: 任意猎物捕获状态=已报废 时 +1。

猎物库统计.当前活跃数:
  type: number
  check: 已捕获 + 调教中 + 已臣服 + 养护中 的猎物总数。

# ============================================================
# 调教场景 — 当前会话状态
# ============================================================

调教场景.当前手段:
  type: string
  check: 记录当前使用的调教手段名称。切换手段时更新。

调教场景.当前轮次:
  type: number
  check: 每次高潮或手段切换时 +1。同一手段持续多轮时递增。

调教场景.猎物.${猎物名}.当前高潮值:
  type: number
  range: ">=0"
  check: |
    AI 更新此值追踪猎物的实时唤起度。
    当 当前高潮值 >= 猎物库.${猎物名}.高潮阈值 时，脚本自动：
    1. 计算精神力摄取量（品质系数 × 高潮强度 × 淫荡度系数 × 臣服系数）
    2. 注入 蔺鸢汀.精神力含量
    3. 更新 猎物库.${猎物名}.累计贡献精神力
    4. 更新 猎物库.${猎物名}.最近产出品质
    5. 将 当前高潮值 重置为 0（连续高潮时重置为 20~30）
    AI 不需要手动执行以上步骤。
    连续高潮：淫荡度每+200 → 高潮后重置值 +5。

调教场景.猎物.${猎物名}.本次高潮强度:
  type: string
  check: |
    AI 在猎物接近高潮时根据叙事判定本次高潮强度：
    - "强"：多层刺激叠加、生殖腔高潮、强制连续高潮
    - "中"：正常刺激达高潮（默认）
    - "弱"：单次轻度刺激即高潮、边缘高潮
    影响精神力摄取量：强=×1.0, 中=×0.6, 弱=×0.3

调教场景.猎物.${猎物名}.本轮臣服收益:
  type: number
  check: |
    AI 在每轮调教结束后记录本轮获取的臣服进度增量（纯增量值，不是最终进度）。
    调教结束时，AI 还需将此增量 apply 到 猎物库.${猎物名}.臣服进度。

调教场景.猎物.${猎物名}.本轮崩坏风险:
  type: number
  check: |
    AI 在每轮调教结束后记录本轮崩坏值增量（纯增量值，不是最终值）。
    调教结束时，AI 还需将此增量 apply 到 猎物库.${猎物名}.崩坏值。

调教场景.猎物.${猎物名}.本轮淫荡增量:
  type: number
  check: |
    AI 在每轮调教结束后记录本轮淫荡度增量。
    调教结束时，AI 还需将此增量 apply 到 猎物库.${猎物名}.淫荡度。

调教场景.猎物.${猎物名}.部位.${部位名}.本轮开发程度:
  type: number
  check: AI 记录本轮对该部位的开发度增量。调教结束时 apply 到 猎物库.${猎物名}.部位.${部位名}.开发度。

