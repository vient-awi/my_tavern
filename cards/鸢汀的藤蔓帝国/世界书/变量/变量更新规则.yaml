# 副本进度（待定） — z.record
# ============================================================

副本进度.${副本名}.解锁状态:
  type: string
  check: |
    - "未解锁" → 当 蔺鸢汀._当前大境界 达到对应条件 → "已解锁"
    - 虫族：_当前大境界 为 "播散期" 或更高
    - 兽族：_当前大境界 为 "成荫期" 或更高
    - 翼族：_当前大境界 为 "蔽日期" 或更高
    - "已解锁" → 玩家开始探索 → "进行中"
    - "进行中" → 完成副本目标 → "已完成"
    已解锁后不可回退。

副本进度.${副本名}.解锁条件:
  type: string
  check: 固定描述，生成时设定。如"精神力含量达10万（播散期）"。
